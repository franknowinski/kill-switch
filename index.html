     sources in prototype/brand/. og:image must be absolute or link previews skip it. -->

<style>
:root{
  --bg:#0B0F14;--panel:#121923;--line:#223041;--line2:#2C3D52;--fg:#E6EDF3;--muted:#8A9BB0;
  --blue:#5CC8FF;--blue-bg:#10263A;--ink:#06121C;
  --amber:#F5A524;--amber-bg:#2A1C08;--amber-line:#6B4A12;
  --red:#FF5C5C;--green:#3DDC84;
  --display:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{overflow-x:clip} /* fight sparks and knock-offs fly past the edge for a moment: never let the page scroll sideways */
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-family:var(--display);font-size:28px;margin:0;letter-spacing:1px}
/* the board (v0.26, back from v0.22): a tabletop tilted back with the browser's own CSS 3D. .zoom holds the perspective;
   .tilt (inside) tilts the board and its fx layer together, so fight stand-ins use the same coordinates as the squares.
   .boardwrap fills the space between the info on top and the buttons at the bottom. */
.boardwrap{position:relative;flex:1;min-height:0;margin:8px 4px 16px} /* room under the near row: the blocks' front faces stand out of the board */
.zoom{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;aspect-ratio:1;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-touch-callout:none}
/* v0.36 (DEV-294): on a phone the board is most of the screen, so a vertical swipe on it scrolls the page (to the rules).
   pan-y lets it; a touch that starts on a square you can drag from right now is held by the board's touchmove listener
   (bindPointer), not by touch-action on the squares: the browser's hit-test of the tilted board misses whole rows */
.sq{position:relative;border-radius:7px;background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 2px 5px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:clamp(14px,4.6vw,22px);min-width:0;min-height:0;padding:0;color:var(--fg)}
.sq.block{background:#070A0E;border-color:#0f151d}
.sq.ai{color:var(--amber)}.sq.h{color:var(--blue)}
.sq.can{box-shadow:inset 0 0 0 3px rgba(92,200,255,.55)}
.sq.can.ai{box-shadow:inset 0 0 0 3px var(--red)}
.sq.copy{box-shadow:inset 0 0 0 3px var(--green)}
.sq.last{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
/* 🏢 the humans' datacenter: a square they place in setup. Dim; lit once the 🧠 is a 10 (the CTO drains it there); pulsing
   while the CTO stands on it and drains the 🧠 (v0.38, DEV-295); dark once the drain has started and nobody is draining */
.sq.dc::after{content:"🏢";position:absolute;font-size:.8em;opacity:.45;pointer-events:none}
.sq.dc[data-id]::after{left:2px;top:0;font-size:.5em;opacity:.9;transform:translateZ(calc(var(--ph) + 2px))}
.sq.dc.live{background:#2a2208;border-color:#8a6d12}.sq.dc.live::after{opacity:1;animation:bolt 1.2s ease-in-out infinite}
.sq.dc.drain{background:#2a2208;border-color:#ffd84a;animation:drainpulse 1.1s ease-in-out infinite}.sq.dc.drain::after{opacity:1;animation:bolt 1.1s ease-in-out infinite}
@keyframes drainpulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,216,74,.3)}50%{box-shadow:inset 0 0 0 3px rgba(255,216,74,1),0 0 12px rgba(255,216,74,.55)}}
.sq.dc.off::after{opacity:.18;filter:grayscale(1)}
.sq.dc.pick{box-shadow:inset 0 0 0 3px var(--blue)}
/* ↑ a piece that took power from the datacenter (+1, once) */
.bst{position:absolute;right:4%;top:2%;font-size:.45em;font-weight:700;color:#ffd84a;text-shadow:0 1px 2px #000;font-style:normal;pointer-events:none;transform:translateZ(calc(var(--ph) + 3px))}
@keyframes bolt{50%{filter:drop-shadow(0 0 6px #ffd84a)}}
/* ↺ a piece that switched sides at a trap (v0.28), shown only where its face is: in its old army's colour */
.trn{position:absolute;left:11%;bottom:14%;font-size:.42em;font-weight:700;line-height:1;padding:.12em .28em;border-radius:.5em;font-style:normal;pointer-events:none;transform:translateZ(calc(var(--ph) + 3px));color:#06121C}
.trn.h{background:var(--blue)}.trn.ai{background:var(--amber)}
.pc .trn,.kr .trn{position:static;transform:none;font-size:9px;margin-left:3px;padding:1px 3px}
/* pieces: raised blocks with a top, a front and two sides, and a soft shadow (v0.17) */
:root{--tilt:28deg;--ph:7px}
.zoom{perspective:1100px;perspective-origin:50% -40%}
.tilt{position:relative;transform-style:preserve-3d;transform:rotateX(var(--tilt));transform-origin:50% 100%;margin-top:-6%} /* the tilt leaves a gap above the far edge: pull it up */
.board,.sq,.fx{transform-style:preserve-3d}
.pz,.clone{position:absolute;transform-style:preserve-3d;pointer-events:none;font-weight:700}.pz{inset:0}
.clone{font-size:clamp(14px,4.6vw,22px)}
.shd{position:absolute;inset:18% 12% 6%;border-radius:8px;background:rgba(0,0,0,.6);filter:blur(3px);transform:translate3d(1px,3px,1px)}
.blk{position:absolute;inset:8% 9% 12%;transform-style:preserve-3d;transition:transform .15s}
.face{position:absolute;border-radius:6px}
.ftop{inset:0;transform:translateZ(var(--ph));display:flex;align-items:center;justify-content:center;line-height:1;transition:box-shadow .15s}
.ffr{left:2px;right:2px;bottom:0;height:var(--ph);transform-origin:bottom;transform:rotateX(-90deg);border-radius:0 0 6px 6px}
.flf{top:2px;bottom:2px;left:0;width:var(--ph);transform-origin:left;transform:rotateY(-90deg)}
.frt{top:2px;bottom:2px;right:0;width:var(--ph);transform-origin:right;transform:rotateY(90deg)}
.h .ftop{background:linear-gradient(180deg,#1a4068,var(--blue-bg));border:1px solid #2a6a96;color:var(--blue);border-top-color:#4f9fd0}
.h .ffr{background:linear-gradient(#0d2238,#071422)}.h .flf,.h .frt{background:#0a1a2b}
.ai .ftop{background:linear-gradient(180deg,#4a3209,var(--amber-bg));border:1px solid var(--amber-line);color:var(--amber);border-top-color:#a8761e}
.ai .ffr{background:linear-gradient(#2b1d06,#140d03)}.ai .flf,.ai .frt{background:#1f1504}
.ftop .ic{font-size:1.02em;line-height:1}.ftop .ic.up,.floater .ic.up{font-size:.92em;transform:translate(-14%,-10%)} /* room for the number in the corner */
.ftop .n{position:absolute;right:3%;bottom:3%;font-size:.5em;padding:.08em .26em;border-radius:.4em;background:rgba(0,0,0,.5);font-weight:700;line-height:1.1}
.sq .q,.clone .q,.floater .q{color:var(--amber);opacity:.85}.sq.h .q,.clone.h .q{color:var(--blue)}
.sq.asi .ftop{box-shadow:0 0 0 2px var(--red),0 0 14px rgba(255,92,92,.8)}
.sq.sel .blk{transform:translateZ(12px) scale(1.08)}
.sq.sel .ftop{box-shadow:0 0 0 2px var(--blue),0 0 18px rgba(92,200,255,.6)}
body.me-ai .sq.sel .ftop{box-shadow:0 0 0 2px var(--amber),0 0 18px rgba(245,165,36,.6)}
.sq:not(.sel) .blk.idle:not(.reveal){animation:bob 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateZ(3px)}}
.pz.drag{visibility:hidden}
/* while dragging, a flat copy of the piece follows the finger above the table. It sits at the top left of the screen and
   is moved by a transform only (set each frame from the code; v0.33, DEV-291), so a drag does no layout work */
.floater{position:fixed;left:0;top:0;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:700;will-change:transform;box-shadow:0 14px 22px rgba(0,0,0,.6),0 0 22px rgba(92,200,255,.5)}
.floater.h{background:linear-gradient(180deg,#1a4068,var(--blue-bg));border:1px solid #2a6a96;color:var(--blue)}
.floater.ai{background:linear-gradient(180deg,#4a3209,var(--amber-bg));border:1px solid var(--amber-line);color:var(--amber);box-shadow:0 14px 22px rgba(0,0,0,.6),0 0 22px rgba(245,165,36,.5)}
.floater .n{position:absolute;right:4%;bottom:4%;font-size:.5em;padding:.08em .26em;border-radius:.4em;background:rgba(0,0,0,.5)}
.spk{position:absolute;width:6px;height:6px;margin:-3px;border-radius:2px;background:var(--amber);pointer-events:none}
.sq.can{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(92,200,255,.35)}50%{box-shadow:inset 0 0 0 3px rgba(92,200,255,.9)}}
.sq.can.ai{animation:pulser 1.1s ease-in-out infinite}
@keyframes pulser{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,92,92,.4)}50%{box-shadow:inset 0 0 0 3px rgba(255,92,92,1)}}
/* where a drag lands if you let go now (v0.33, DEV-291): steady and bright, over the lit squares' pulse */
.sq.over,.sq.can.ai.over{animation:none;background:#2b5a85;border-color:#fff;box-shadow:inset 0 0 0 3px #fff,0 0 18px 2px rgba(92,200,255,.9)}
.blk.reveal{animation:flip3d .5s cubic-bezier(.3,1.4,.5,1)} /* the idle bob skips a revealing block, or it would hide the flip */
@keyframes flip3d{0%{transform:translateZ(30px) rotateY(-90deg)}100%{transform:none}}
.sq.turned .ftop{animation:turnflash .7s ease-out}
@keyframes turnflash{0%{filter:brightness(1)}30%{filter:brightness(2.2) saturate(2)}100%{filter:brightness(1)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}


.flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle,rgba(245,165,36,.4),transparent 70%);animation:flashout .6s ease-out forwards}
.board.shake{animation:shake .4s}.board.shake.big{animation:shakebig .6s}
@keyframes shakebig{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(9px,-4px)}45%{transform:translate(-7px,2px)}60%{transform:translate(7px,-2px)}80%{transform:translate(-3px,0)}}
.dots i{font-style:normal;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
body.won .board{animation:shake .5s}body.lost .board{animation:shake .5s}
body.won::after,body.lost::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;animation:flashout 1.1s ease-out forwards}
body.won::after{background:radial-gradient(circle,rgba(61,220,132,.35),transparent 70%)}
body.lost::after{background:radial-gradient(circle,rgba(255,92,92,.4),transparent 70%)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(4px,0)}}
@keyframes flashout{from{opacity:1}to{opacity:0}}
.ghost.sm{flex:0 0 52px}
.msg{margin:4px 8px 0;padding:6px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;line-height:1.4;height:calc(2 * 1.4em + 14px);overflow-y:auto;flex-shrink:0} /* a fixed height: a longer message must never move the board under the finger */
.msg b{color:var(--amber)}
.msg .you{color:var(--blue)}.msg .them{color:var(--amber)}
body.me-ai .msg .you,body.me-ai .you{color:var(--amber)}body.me-ai .msg .them{color:var(--blue)}body.me-ai .msg b{color:var(--blue)}
.link{margin:6px 8px 0;padding:8px 10px;border-radius:10px;background:#0d131b;border:1px solid var(--line);font-size:10.5px;color:var(--muted);word-break:break-all;max-height:64px;overflow:auto;user-select:all}
.row2{display:flex;gap:8px}.row2 .ghost{font-size:13px}
/* play a friend (v0.30): the game code, the join box, this phone's games, the turn pill */
.codebig{font-family:var(--display);font-size:46px !important;letter-spacing:10px;text-align:center;line-height:1.1 !important;padding-left:10px}
.join{display:flex;gap:8px;margin:0}.join input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:#0d131b;color:var(--fg);font:700 18px var(--mono);letter-spacing:6px;text-transform:uppercase;text-align:center;padding:0 8px}
.join input::placeholder{color:var(--muted);letter-spacing:4px}.join .ghost{flex:0 0 96px}
.games{display:flex;flex-direction:column;gap:6px}.games[hidden]{display:none}
.game{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line2);background:#0d131b;font:600 13px var(--mono);text-align:left;color:var(--fg)}
.game .gc{font-family:var(--display);font-size:17px;letter-spacing:3px}.game .gs{flex:1;color:var(--muted);text-align:right}.game .gs b{color:var(--blue)}
.pill.turn{margin-left:auto;color:var(--muted)}.pill.turn.mine{color:var(--ink);background:var(--blue);border-color:var(--blue)}
body.me-ai .pill.turn.mine{background:var(--amber);border-color:var(--amber)}
.nw{white-space:nowrap}.on{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line2);margin-left:4px;vertical-align:middle}.on.yes{background:var(--green)}
.msg b.recon,body.me-ai .msg b.recon,.lvnote{color:#ffd84a}
.msg.over{border-width:2px;display:flex;flex-direction:column;gap:6px;height:auto}
.msg.over h1{font-size:24px}.msg.over.win{border-color:var(--green)}.msg.over.lose{border-color:var(--red)}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:6px;font-weight:600;font-size:13px;flex-shrink:0}
.pc.h{background:var(--blue-bg);border:1px solid #1f4b6b;color:var(--blue)}
.pc.ai{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber)}
.actions{display:flex;gap:8px;padding:0 8px;flex-shrink:0}.actions .ghost,.actions .primary{min-height:44px}.actions .primary{font-size:16px}
/* game over (v0.37, DEV-296): PLAY AGAIN · RULES ↓ · 🔊 · 🏠 on one line, each label on one line, down to 320 px */
.actions.end button{white-space:nowrap;padding:0 4px}
@media (max-width:360px){.actions.end .primary{font-size:14px;letter-spacing:.5px}.actions.end .ghost:not(.sm){font-size:13px;letter-spacing:.5px}.actions.end .ghost.sm{flex-basis:44px}}
.ghost{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:transparent;font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:15px}
.ghost[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:#0d2418}
.ghost:disabled{opacity:.4}
.primary{flex:1;min-height:52px;border-radius:14px;border:0;background:var(--blue);color:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:5}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card p{margin:0;font-size:14px;line-height:1.5}
.rules{display:grid;gap:8px;margin:2px 0}
.rule{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.35}
.rule .k{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rule .k.b{background:var(--blue-bg);border:1px solid #1f4b6b}
.rule .k.a{background:var(--amber-bg);border:1px solid var(--amber-line)}
.key{padding:10px 16px 28px;display:flex;flex-direction:column;gap:4px}
.kh{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.kh.b{color:var(--blue)}.kh.a{color:var(--amber)}.kh.n{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:12.5px;line-height:1.45;margin-top:14px}
.kr{display:grid;grid-template-columns:auto minmax(72px,auto) minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;background:#0d131b;border:1px solid #182230;font-size:13px;cursor:pointer}
.kr .pc{min-width:30px;height:28px;font-size:15px;white-space:nowrap;padding:0 6px}
.kr .pc.tok{position:relative;width:34px;padding:0}.kr .pc.tok .ic{font-size:15px}.kr .pc.tok .n{position:absolute;right:3px;bottom:0;font-size:9px;font-weight:700}
.kr .kn{font-weight:600;white-space:nowrap}
.kr .kp{color:var(--muted);font-size:12px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.kc{font-weight:600;font-size:13px;white-space:nowrap}.kc i{font-style:normal;color:var(--muted);font-weight:400;font-size:11px}
.kr.gone{opacity:.35}.kr.gone .pc{filter:grayscale(1)}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ranks .kr{grid-template-columns:auto minmax(0,1fr) auto;padding:4px 8px}.ranks .kr .kn{min-width:0;overflow:hidden;text-overflow:ellipsis}.ranks .kr .kp{display:none}
.kr .kb{color:var(--amber);font-size:11px;letter-spacing:0;white-space:nowrap} /* v0.29: AI fighters 5–6 take +1 at the 🏢, once */
.seen{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);padding:2px 8px 4px}
.seen .pc{min-width:24px;height:22px;font-size:12px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
/* the Watcher lockup on the start screen (v0.34, DEV-292): outlined text, so no font load; its red eye sweeps the visor
   (clipped to the visor, so its glow and trail never smear onto the helmet) */
.logo{line-height:0;margin:2px 0 0}.logo > svg{height:40px;width:auto;max-width:100%;display:block}.eyebrow.tag{margin-top:-2px}
.logo .eye{animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,18%,100%{transform:translateX(0)}42%,60%{transform:translateX(-19px)}}
@media (prefers-reduced-motion:reduce){.logo .eye{animation:none}}
pre{white-space:pre-wrap;padding:16px;font-size:13px}
/* alerts: level-ups and milestones slide in over the top of the board */
.toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.toast{padding:7px 14px;border-radius:999px;background:#2A1C08;border:1px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:13px;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:tin .25s ease-out, tout .5s ease-in forwards;animation-delay:0s,var(--hold,1.6s);max-width:calc(100vw - 32px);text-align:center;text-wrap:balance}
.toast.big{font-size:17px;padding:12px 20px;background:#3a0f0f;border-color:var(--red);color:#fff;--hold:3.2s}
.toast.drain{background:#2a2208;border-color:#ffd84a;color:#ffd84a}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#app{display:flex;flex-direction:column;width:100%}
/* play screen (v0.23), one column everywhere: pills, the last fight, the message, the board as large as fits, the buttons.
   Rules and pieces are below, by scrolling. */
.left{display:flex;flex-direction:column;height:calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:470px;padding-bottom:14px}
.hud{display:flex;gap:6px;align-items:center;padding:6px 8px 0;flex-shrink:0}
.pill{font:600 12px var(--mono);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:rgba(14,20,28,.88);border:1px solid var(--line2);white-space:nowrap}
.pill.am{color:var(--amber);border-color:var(--amber-line);background:linear-gradient(90deg,rgba(245,165,36,.22) var(--p,0%),rgba(14,20,28,.88) var(--p,0%))}
.fline{display:flex;gap:8px;align-items:center;margin:4px 8px 0;padding:6px 10px;border-radius:10px;background:#0d131b;border:1px solid var(--line);font-size:13px;color:var(--fg);text-align:left;width:auto;font-family:var(--mono);flex-shrink:0}
.fline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fline.none{color:var(--muted);border-style:dashed} /* holds its row before the first fight, so the board doesn't jump when it appears; v0.39 (DEV-297): says so instead of a blank band */.fline small{color:var(--muted);font-size:11px;flex-shrink:0}
.fline .you{color:var(--blue)}.fline .them{color:var(--amber)}body.me-ai .fline .you{color:var(--amber)}body.me-ai .fline .them{color:var(--blue)}
.more{text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;margin:14px 0 0}
/* after a fight the winner's number rises from the square and fades; never blocks a tap */
.float{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:44px;line-height:1;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.85),0 0 2px #000}
.float.h{color:var(--blue)}.float.ai{color:var(--amber)}.float.n{color:var(--fg)}.float .x{color:var(--muted);font-size:.6em;margin:0 .15em}.float .b{color:var(--blue)}.float .a{color:var(--amber)}
.card.lobby .link{margin:0}.card.lobby h1{font-size:26px}.card .rules .rule b{color:var(--fg)}
/* the start screen: pick a side, then PLAY */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:#0d131b;border:1px solid var(--line2)}
.seg button{min-height:48px;border-radius:10px;border:1px solid transparent;background:transparent;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:1px;color:var(--muted)}
.seg button[aria-pressed="true"].h{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.seg button[aria-pressed="true"].ai{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.seg.lv{grid-template-columns:1fr 1fr 1fr}.seg.lv{margin-top:-6px}.seg.lv button{min-height:36px;font-size:14px;padding:0 4px}
.seg.lv button[aria-pressed="true"]{background:#1B2633;border-color:var(--fg);color:var(--fg)} /* v0.35: the bot's level, beside the side picker */
.pill.lvl{color:var(--muted)}
/* v0.39 (DEV-297): the narrowest phones (iPhone SE 1st gen, 320px) tighten the pills so all three fit on one line, "🧠 superintelligence" in full
   (one line: a wrap would move the board when the pill text changes mid-game) */
@media (max-width:359px){.hud{gap:4px}.pill{padding:5px 7px;letter-spacing:0}}
/* home-screen app (DEV-297, the user: "the top r1 and grows in 6 can be a bit lower"): the pills drop 10px from the status bar /
   Dynamic Island (the body already pads by the safe area), and the fight line gives the same 10px back, so the board doesn't move */
.standalone .hud{padding-top:16px}.standalone .fline{margin-top:2px;padding-top:2px;padding-bottom:2px}
.lgs{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;font-size:13px;line-height:1.4}
.lgs div{padding:4px 2px;border-bottom:1px solid #182230}.lgs i{font-style:normal;color:var(--muted);font-size:11px;margin-right:6px}.lgs .mile{color:var(--amber)}
/* phones: the board stretches to fill the space (squares taller than wide) with a flatter tilt, as in v0.22 */
@media (max-width:859px){
  /* iPhone Safari 26 floats its tab bar over the bottom of the page, and the viewport units don't leave room for it:
     lift the buttons above it (v0.28: START was under the bar at setup) */
  .ios-bar .left{padding-bottom:calc(14px + max(0px, 76px - env(safe-area-inset-bottom)))}
  .zoom,.tilt{height:100%}
  .zoom{perspective:1300px;perspective-origin:50% -30%}
  :root{--tilt:20deg;--ph:9px}
  .tilt{margin-top:0}
  .board{aspect-ratio:auto;height:100%;grid-template-rows:repeat(8,minmax(0,1fr))}
  .sq,.clone{font-size:clamp(15px,5.4vw,28px)}
}
@media (min-width:860px){
  /* desktop: the same column, as wide as the board can be while everything fits the window's height */
  #app{align-items:center;padding:0 20px}
  .left{width:min(100%,calc(100svh - 200px));min-height:520px;padding:10px 0 16px}
  .hud,.actions{padding-left:0;padding-right:0}
  .fline,.msg,.link{margin-left:0;margin-right:0}.boardwrap{margin:8px 0}
  .boardwrap{display:flex;flex-direction:column;justify-content:center;margin:14px 0 16px}
  .left{width:min(100%,calc(100svh - 240px))}
  .board{gap:4px}:root{--ph:9px}.tilt{margin-top:-1%}
  .sq,.clone{font-size:calc(min(100vw - 40px, 100svh - 240px) * .048)}.sq{border-radius:9px}
  .msg{font-size:14px}
  .right{width:min(100%,760px)}
  .key{padding:14px 0 24px}
  .msg.over h1{font-size:28px}
  /* v0.29: the board is as wide as the column, so a taller box above it (the end screen) pushed its tilted far row up over the
     message. Size it by the room it has instead: the board is never wider than its space is tall, less the 3D blocks' overhang */
  .boardwrap{container-type:size}
  .zoom{width:min(100%,calc(100cqh * var(--fit)));margin:0 auto}
  :root{--fit:.97}
}
.ranks .kr .kn{white-space:normal;overflow:visible;line-height:1.15} /* "self-improver", "rogue agent" wrap rather than being cut off */
@media (max-width:360px){.ranks .kr{gap:6px;padding:4px 6px}.ranks .kr .kn{font-size:12px}}
@media (prefers-reduced-motion:reduce){.blk.idle,.blk.reveal,.sq.can,.sq.can.ai,.sq.dc.live::after,.sq.dc.drain,.sq.dc.drain::after,.sq.turned .ftop,.board.shake,.toast{animation:none!important}.blk{transition:none}}
</style>

<body>
<div id="app"></div>
<script>
// ENGINE-START
const COLS = 8, ROWS = 8;
const BLOCKED = new Set(["3,2","4,2","3,5","4,5"]);
const SETUP_ROWS = { H: [5,6,7], AI: [0,1,2] }; // every square in these rows is filled, like Stratego
// Tuning: everything that decides fairness is here.
const BAL = {
  RSI_EVERY: 6,     // the 🧠 self-improver grows itself +1 every N rounds while it lives, up to MAX_STR (v0.27: 4, was 7: the cut at the humans' own 🏢 is easier to reach; v0.28: 5, with the deepfake back and the 🏢 on the back row; v0.29: 6, now that only fighters 5–6 boost)
  MAX_STR: 10, COPIES: 2, MAX_ROUNDS: 100, // past MAX_ROUNDS the game is a draw
  AGI: 8, ASI: 10,  // the 🧠's milestones: AGI at 8, superintelligence at 10
  SPY_MIN: 8, SPY_MAX: 9, // the whistleblower / virus kills a piece this strong when it attacks it, and loses to anything else
  BOOST_MIN: 5, BOOST_MAX: 6, // an AI fighter this strong when it steps on the 🏢 takes +1 there, once (v0.28: 1 to 7, any numbered piece; v0.29: fighters 5 to 6)
  DRAIN: 1,         // v0.38 (DEV-295): the 🧠 loses this much at the end of each human turn the CTO stands on the 🏢, once it has been a 10 (was: one tap cut it to 0)
};
// 🏢 the humans' datacenter (v0.27): a square on their setup rows that they place in setup (s.dc); it starts on their back
// row (v0.28). No piece starts on it; any piece can stand on it. An AI fighter that is a 5 or 6 when it moves onto it gets +1,
// once per piece, until the power drain starts (v0.29: so a 🐝 5 becomes 6 and a 🤖 6 becomes 7; never the 🦾 7 or 👾 8, the 🧠,
// the deepfake, or a non-fighter, whose value is its ability). A turned piece goes by its current side, type and number.
// v0.38 (DEV-295): once the 🧠 has been a 10, each human turn that ends with the CTO on the 🏢 drains it by BAL.DRAIN
// (10 → 9 → 8 …). s.cut means the drain has started: the 🧠 never grows again and the 🏢 gives no more +1s. Above 0 it fights
// with its number; at 0 it is fragile (loses every fight). The CTO leaving or dying stops the drain; nothing regrows.
const onDC = (s, r, c) => !!s.dc && s.dc[0] === r && s.dc[1] === c;
const BOOSTS = p => p.side === "AI" && p.type === "X" && p.str >= BAL.BOOST_MIN && p.str <= BAL.BOOST_MAX;
// Types. F flag, T trap (honeypot / backdoor: converts the attacker; an M removes it), S slider (drone / crawler),
// M remover (engineer / hacker), C scanner (reveals adjacent hidden enemies), R replicator (cut in v0.11.27: nobody understood it; the engine still understands it),
// A whistleblower / virus (the spy: kills an 8 or 9 when attacking, else dies; both sides have one), I self-improver (grows itself
// to 10, superintelligence), K deepfake (the AI's mirror: in a fight it copies the other piece's number, so both fall, except against a 🧠 at 10), X fighter.
// P persuader was cut in v0.11.13; the engine still understands it.
// 22 a side (v0.25): flag, 3 traps, 3 sliders, 3 removers, scanners, specials; fighters humans 5 5 6 6 6 7 7 8 9 (v0.28: a third 6 for a third 5), AI 5 5 6 6 7 7 8.
// One character per number. Two front-row squares start empty. v0.28: the AI's 🎭 deepfake (K) is back, in place of its third 🐝 swarm 5.
const ARMIES = {
  H:  [["F",0],["T",0],["T",0],["T",0],["S",1],["S",1],["S",1],["M",3],["M",3],["M",3],["A",1],["C",2],["C",2],
       ["X",5],["X",5],["X",6],["X",6],["X",6],["X",7],["X",7],["X",8],["X",9]],
  AI: [["F",0],["T",0],["T",0],["T",0],["S",1],["S",1],["S",1],["M",3],["M",3],["M",3],["I",2],["A",2],["C",2],["C",2],
       ["K",0],["X",5],["X",5],["X",6],["X",6],["X",7],["X",7],["X",8]],
};
const GAPS = 2;
const LEVELS_UP = t => t !== "F" && t !== "T" && t !== "K"; // pieces with a number (the deepfake has none: it copies)
const COPYABLE = t => !["F","T","R","I"].includes(t);
// where a piece likes to start: higher = further back
const PLACE = { X: p => p.str, K: () => 3, S: () => 1, M: () => 2, A: () => 4, C: () => 3, R: () => 4, P: () => 3, I: () => 6 };
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
// Lineups: five per side, written back row first. Letters are piece types, digits fighters by strength (the nearest
// free number if that one is used up), "." an empty front square. Each is applied straight or mirrored, so a lineup's name
// doesn't give the whole setup away. The CTO and the self-improver stay on the back row in all of them.
const FORMATIONS = {
  H: [
    { name: "Fortress", hint: "The Internet in a corner, walled in.", rows: ["FT89C67S", "T7MA6MC5", "S56.MTS."] },
    { name: "Keep", hint: "The Internet mid-row, big numbers around.", rows: ["S5TF798T", "6M7TSACM", "5C.6M6.S"] },
    { name: "Spearhead", hint: "Top agents up front. Attack early.", rows: ["FT9C5ST5", "T6CM6MSA", ".6877MS."] },
    { name: "Wall", hint: "Honeypots across the back, two fake flags.", rows: ["TFT98S7T", "M7MC6ACS", "65S.5M6."] },
    { name: "Bluff", hint: "Traps where the flag would be.", rows: ["T6S8C9TF", "5M7ACM6T", "S56.MS7."] },
  ],
  AI: [
    { name: "Fortress", hint: "Kill switch in the corner, walled in.", rows: ["FT8IC67S", "T7MA6MCK", "S5M.5TS."] },
    { name: "Keep", hint: "Kill switch mid-row, big numbers around.", rows: ["S8TFTI7C", "6M6T7ACK", "5S.5MM.S"] },
    { name: "Spearhead", hint: "Top agents up front. Attack early.", rows: ["FT5CMSTI", "T6KM6ASS", ".877C5M."] },
    { name: "Wall", hint: "Backdoors across the back, two fake switches.", rows: ["TFTSIC8T", "M7MC6A7S", "65S.KM5."] },
    { name: "Bluff", hint: "Traps where the switch would be.", rows: ["T6S8CITF", "KM7ACM6T", "S5M.5S7."] },
  ],
};
const FORM_ROWS = side => side === "H" ? [7,6,5] : [0,1,2]; // back, middle, front
function formationSpots(side, f, mine, mirror){
  const pool = mine.slice(), spots = new Map(), digits = [];
  f.rows.forEach((row, i) => [...row].forEach((ch, c) => {
    if (ch === ".") return;
    const sq = [FORM_ROWS(side)[i], mirror ? COLS - 1 - c : c];
    if (/\d/.test(ch)){ digits.push({ n: +ch, sq }); return; }
    const k = pool.findIndex(p => p.type === ch); if (k < 0) throw new Error("lineup " + f.name + ": no " + ch + " left");
    spots.set(pool.splice(k, 1)[0], sq);
  }));
  if (pool.some(p => p.type !== "X") || pool.length !== digits.length) throw new Error("lineup " + f.name + ": piece count");
  for (const exact of [true, false]) for (const d of digits){
    if (d.done) continue;
    let bi = -1, bd = 99; pool.forEach((p, k) => { const dd = Math.abs(p.str - d.n); if (dd < bd && (!exact || dd === 0)){ bd = dd; bi = k; } });
    if (bi >= 0){ spots.set(pool.splice(bi, 1)[0], d.sq); d.done = true; }
  }
  return spots;
}
// a random spread: flag on the back row with traps around it, strong pieces at the back, weak at the front, with some jitter
function randomSpots(side, mine, r){
  const spots = new Map();
  const rows = SETUP_ROWS[side];
  const back = side === "H" ? ROWS - 1 : 0;
  const front = side === "H" ? Math.min(...rows) : Math.max(...rows);
  const gapCols = shuffle([0,1,2,3,4,5,6,7], r).slice(0, GAPS);
  const squares = []; for (const row of rows) for (let c = 0; c < COLS; c++) if (!(row === front && gapCols.includes(c))) squares.push([row,c]);
  shuffle(squares, r);
  const flagSq = squares.find(sq => sq[0] === back);
  const rest = squares.filter(sq => sq !== flagSq);
  const fwd = side === "H" ? -1 : 1;
  const near = rest.filter(sq => Math.abs(sq[0]-flagSq[0]) + Math.abs(sq[1]-flagSq[1]) === 1).sort((a, b) => (b[0] - flagSq[0]) * fwd - (a[0] - flagSq[0]) * fwd); // the square facing the enemy first
  const far = rest.filter(sq => !near.includes(sq));
  const depth = ([row]) => Math.abs(row - back);
  far.sort((a, b) => (depth(a) + r() * 1.3) - (depth(b) + r() * 1.3));
  const flag = mine.find(p => p.type === "F"), traps = mine.filter(p => p.type === "T");
  const others = mine.filter(p => p.type !== "F" && p.type !== "T").sort((a, b) => (PLACE[b.type](b) + r() * 1.5) - (PLACE[a.type](a) + r() * 1.5));
  spots.set(flag, flagSq);
  traps.forEach((t, k) => spots.set(t, near[k] || far.shift()));
  // the piece that matters most for the endgame always starts on the back row: your CTO, the AI's self-improver
  const key = side === "H" ? others.reduce((m, p) => p.type === "X" && (!m || p.str > m.str) ? p : m, null) : others.find(p => p.type === "I");
  if (key){ const bi = far.findIndex(sq => sq[0] === back); if (bi >= 0){ spots.set(key, far.splice(bi, 1)[0]); others.splice(others.indexOf(key), 1); } }
  others.forEach((p, k) => spots.set(p, far[k]));
  return spots;
}
// place one side again: form is an index into FORMATIONS[side], or null for a random spread
function layoutSide(s, side, form, r){
  const mine = s.pieces.filter(p => p.side === side), mirror = r() < .5;
  const spots = form == null ? randomSpots(side, mine, r) : formationSpots(side, FORMATIONS[side][form], mine, mirror);
  for (const [p, [row, c]] of spots){ p.r = row; p.c = c; }
  if (side === "H"){ // the datacenter starts on the back row (v0.28): the back-row piece that matters least (never the Internet, a
    // honeypot or the CTO) steps forward onto the empty front square nearest the middle, and the 🏢 takes its square
    const free = []; for (const row of SETUP_ROWS.H) for (let c = 0; c < COLS; c++) if (!mine.some(p => p.r === row && p.c === c)) free.push([row, c]);
    free.sort((a, b) => Math.abs(a[1] - 3.5) - Math.abs(b[1] - 3.5) || a[0] - b[0]);
    const back = ROWS - 1, mid = p => Math.abs(p.c - 3.5);
    const step = mine.filter(p => p.r === back && p.type !== "F" && p.type !== "T" && !(p.type === "X" && p.str === 9))
      .sort((a, b) => PLACE[a.type](a) - PLACE[b.type](b) || mid(a) - mid(b))[0];
    if (step && free.length){ s.dc = [back, step.c]; [step.r, step.c] = free[0]; }
    else s.dc = free[0];
  }
  s.forms[side] = form; s.mirror[side] = mirror;
  return s;
}
// forms: { H, AI } lineup indexes (null = random spread); a side left out gets one of its lineups at random
function newGame(seed, forms = {}){
  const r = rng(seed);
  const pieces = []; let id = 0;
  for (const side of ["H","AI"]) for (const [type, str] of ARMIES[side]) pieces.push({ id: id++, side, type, str, revealed: false, r: -1, c: -1 });
  const s = { pieces, turn: "H", round: 1, copies: { H: BAL.COPIES, AI: BAL.COPIES }, winner: null, rsi: true, agi: false, asi: false, cut: false, log: "Humans to move.", last: null, seed, events: [], history: [], pass: false, needSetup: null, forms: {}, mirror: {}, dc: null };
  for (const side of ["H","AI"]) layoutSide(s, side, forms[side] === undefined ? Math.floor(r() * FORMATIONS[side].length) : forms[side], r);
  return s;
}
// every lineup must place exactly the army, or the game is broken from the first screen
for (const side of ["H","AI"]) FORMATIONS[side].forEach((f, k) => formationSpots(side, f, ARMIES[side].map(([type, str], id) => ({ id, side, type, str })), k % 2 === 1));
const at = (s, r, c) => s.pieces.find(p => p.r === r && p.c === c);
const inb = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS && !BLOCKED.has(r + "," + c);
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const other = side => side === "H" ? "AI" : "H";
const sqName = (r, c) => "abcdefgh"[c] + (r + 1);
const neighbours = (s, p) => DIRS.map(([dr,dc]) => at(s, p.r + dr, p.c + dc)).filter(Boolean);
function copySource(s, p){ return neighbours(s, p).filter(q => q.side === p.side && COPYABLE(q.type)).sort((a, b) => b.str - a.str)[0] || null; }
function legalMoves(s, p){
  if (p.type === "F" || p.type === "T") return [];
  const out = [];
  const canCopy = p.type === "R" && s.copies[p.side] > 0 && copySource(s, p);
  for (const [dr,dc] of DIRS){
    let r = p.r + dr, c = p.c + dc;
    while (inb(r,c)){
      const q = at(s, r, c);
      if (q){ if (q.side !== p.side) out.push({ to: [r,c] }); break; }
      out.push({ to: [r,c] });
      if (canCopy) out.push({ to: [r,c], copy: true });
      if (p.type !== "S") break;
      r += dr; c += dc;
    }
  }
  return out;
}
const brainOf = s => s.pieces.find(x => x.type === "I" && x.side === "AI");
const isSuper = p => p.type === "I" && p.str >= BAL.ASI;
const isFragile = p => p.type === "I" && p.str <= 0; // a 🧠 drained to 0 loses every fight (v0.38; v0.27–v0.37: after the cut)
// the humans' own 9: not an AI piece the 🏢 raised to 9 that a honeypot then turned human
const isCTO = p => p.side === "H" && homeSide(p) === "H" && p.type === "X" && (p.base ?? p.str) === 9;
// the 🧠 has been a 10 (s.asi) and has something left to lose: the humans' CTO on the 🏢 drains it
const drainable = s => { const b = brainOf(s); return !!b && s.asi && b.str > 0; };
// the CTO is on the 🏢 now: if the humans' turn ends like this, the 🧠 loses BAL.DRAIN
const draining = s => drainable(s) && s.pieces.some(p => isCTO(p) && onDC(s, p.r, p.c));
function sideMoves(s, side){
  const out = [];
  for (const p of s.pieces) if (p.side === side) for (const m of legalMoves(s, p)) out.push({ p, ...m });
  return out;
}
function clone(s){ return { ...s, pieces: s.pieces.map(p => ({ ...p })), copies: { ...s.copies }, events: [], history: s.history.slice(-40) }; }
const snap = x => ({ id: x.id, side: x.side, type: x.type, str: x.str, base: x.base, hidden: !x.revealed });
function apply(s0, move){
  const s = clone(s0);
  const p = s.pieces.find(x => x.id === move.p.id);
  const side = p.side;
  const [r,c] = move.to;
  const q = at(s, r, c);
  const kill = x => { s.pieces = s.pieces.filter(y => y.id !== x.id); };
  // a piece that switches sides is hidden again (to its old side too), like any piece after a fight; bots remember it (seen)
  const convert = (x, to) => { x.side = to; x.revealed = false; delete x.spot; x.seen = true; };
  const from = sqName(p.r, p.c), to = sqName(r, c);
  let line = "";
  if (move.copy){
    const src = copySource(s, p);
    s.copies[side]--;
    s.pieces.push({ id: Math.max(...s.pieces.map(x => x.id)) + 1, side, type: src.type, str: src.str, revealed: false, r, c });
    p.revealed = true; delete p.spot; // copying shows the replicator for good, not only while a scanner is next to it
    line = `${who(side)} replicator copied the piece next to it.`;
    s.events.push({ kind: "copy", r, c });
    s.history.push({ round: s.round, side, text: line });
  }
  else if (!q){
    p.r = r; p.c = c;
    s.history.push({ round: s.round, side, text: `${side === "H" || p.revealed ? name(p) : "AI piece"} ${from} → ${to}`, mv: { from, to, open: !!p.revealed } });
  }

  }
  // ---- two-player on our server (v0.30, DEV-287): a Cloudflare Worker with one Durable Object per game is the referee.
  // It holds the game, checks every move with this page's own engine (killswitch-server cuts it out of this file) and sends
  // each phone only its own side's view: the other army's hidden pieces arrive under shuffled ids and identities.
  // No accounts: each seat has a secret token, kept on this phone with the game's code ("My games" on the start screen).
  // Leave whenever: the game waits on the server; reopening the link or the game resumes it, and the move you missed plays in.
  const SERVER_URL = "https://kill-switch.franknowinski.workers.dev"; // the one place the server's address lives (?server= overrides, for tests)
  const SERVER = (params.get("server") || SERVER_URL).replace(/\/+$/, "");
  const CODE_OK = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{4}$/; // the server's codes: nothing that reads two ways (no 0 O 1 I L)
  const LIVE = { code: null, token: null, seat: null, host: false, hostSide: "H", guestIn: false, online: { host: false, guest: false }, ready: { H: false, AI: false },
    note: null, fail: null, full: false, ws: null, opened: false, tries: 0, retryT: null, beatT: null, heard: 0, moveSeq: -1, chain: Promise.resolve() };
  const queue = fn => { LIVE.chain = LIVE.chain.then(fn).catch(e => { console.error(e); busy = false; }); }; // one error must not freeze every later message
  const liveYou = () => LIVE.host ? LIVE.hostSide : other(LIVE.hostSide);
  const SIDE_NAME = { H: "the Humans", AI: "the AI" };
  // My games, on this phone: [{ code, token, seat, at, moveSeq }]
  function myGames(){ try { const g = JSON.parse(localStorage.getItem("ks-games") || "[]"); return Array.isArray(g) ? g.filter(x => x && CODE_OK.test(x.code) && typeof x.token === "string") : []; } catch (e) { return []; } }
  function saveGames(list){ try { localStorage.setItem("ks-games", JSON.stringify(list.slice(0, 20))); } catch (e) {} }
  function rememberGame(code, fields){ const list = myGames(), old = list.find(x => x.code === code) || {}; saveGames([{ ...old, ...fields, code, at: Date.now() }, ...list.filter(x => x.code !== code)]); }
  function forgetGame(code){ saveGames(myGames().filter(x => x.code !== code)); }
  const serverParam = () => params.get("server") ? "&server=" + encodeURIComponent(params.get("server")) : "";
  function inviteLink(){ const real = /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname); return (real ? location.href.split("#")[0].split("?")[0] : PUBLIC_URL) + "?g=" + LIVE.code + serverParam(); } // a real address (Pages, localhost) invites back to itself
  async function api(path, opts = {}){
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
    try { const res = await fetch(SERVER + path, { ...opts, signal: ctl.signal, headers: opts.body ? { "Content-Type": "application/json" } : {} }); return { status: res.status, body: await res.json().catch(() => ({})) }; }
    catch (e) { return null; } finally { clearTimeout(t); }
  }
  function send(m){ try { if (LIVE.ws && LIVE.ws.readyState === 1){ LIVE.ws.send(JSON.stringify(m)); return true; } } catch (e) {} return false; }
  function closeSocket(){
    clearTimeout(LIVE.retryT); clearInterval(LIVE.beatT); LIVE.beatT = null;
    const ws = LIVE.ws; LIVE.ws = null; if (ws){ ws.onclose = ws.onmessage = ws.onopen = null; try { ws.close(); } catch (e) {} }
  }
  // back to the start screen; the game stays on the server and in My games
  function leaveLive(){
    closeSocket(); LIVE.chain = Promise.resolve();
    Object.assign(LIVE, { code: null, token: null, seat: null, note: null, fail: null, full: false, tries: 0 });
    mode = "solo"; history.replaceState(null, "", location.pathname + (params.get("server") ? "?server=" + encodeURIComponent(params.get("server")) : ""));
  }
  function liveFail(text, full){ closeSocket(); LIVE.fail = text; LIVE.full = !!full; mode = "live"; phase = "lobby"; render(); }
  async function createLive(){
    leaveLive(); mode = "live"; phase = "joining"; LIVE.note = "Making a game…"; render();
    const r = await api("/games", { method: "POST" });
    if (!r || r.status !== 200 || !CODE_OK.test(r.body.code || "")) return liveFail("Couldn't reach the game server. Check the internet and try again.");
    rememberGame(r.body.code, { token: r.body.token, seat: "host" });
    openGame(r.body.code);
  }
  // open a game by its code: with this phone's token for it, or by taking the free seat
  async function openGame(raw){
    const code = String(raw || "").trim().toUpperCase();
    closeSocket();
    Object.assign(LIVE, { code, token: null, fail: null, full: false, note: null, tries: 0, opened: false, ready: { H: false, AI: false } });
    mode = "live"; phase = "joining"; state = null; lastFight = null; sel = null; info = null; render();
    if (!CODE_OK.test(code)) return liveFail(`"${code}" isn't a game code. Codes are 4 letters and numbers.`);
    history.replaceState(null, "", location.pathname + "?g=" + code + serverParam());
    let mine = myGames().find(x => x.code === code);
    if (!mine){
      const r = await api(`/games/${code}/join`, { method: "POST", body: "{}" });
      if (LIVE.code !== code) return; // gone somewhere else meanwhile
      if (!r) return liveFail("Couldn't reach the game server. Check the internet and try again.");
      if (r.status === 409) return liveFail("This game is full.", true);
      if (r.status !== 200) return liveFail(`There's no game ${code}. Check the code.`);
      rememberGame(code, { token: r.body.token, seat: r.body.seat }); mine = myGames().find(x => x.code === code) || { token: r.body.token };
    }
    LIVE.token = mine.token; LIVE.moveSeq = Number.isInteger(mine.moveSeq) ? mine.moveSeq : -1;
    connect();
  }
  // the socket: reconnects on its own with backoff, and resyncs whenever the page comes back
  function connect(){
    clearTimeout(LIVE.retryT);
    if (!LIVE.code || !LIVE.token || LIVE.ws || LIVE.fail) return;
    let ws; try { ws = new WebSocket(SERVER.replace(/^http/, "ws") + `/games/${LIVE.code}/ws?token=${LIVE.token}`); } catch (e) { return lost(false); }
    LIVE.ws = ws; let opened = false;
    const openT = setTimeout(() => { if (!opened && LIVE.ws === ws){ LIVE.ws = null; ws.onclose = null; try { ws.close(); } catch (e) {} lost(false); } }, 9000);
    ws.onopen = () => {
      opened = true; LIVE.opened = true; clearTimeout(openT); LIVE.tries = 0; LIVE.heard = Date.now();
      send({ t: "hello", moveSeq: LIVE.moveSeq });
      clearInterval(LIVE.beatT);
      LIVE.beatT = setInterval(() => { // a phone that drops off the network never says goodbye
        if (LIVE.ws !== ws) return clearInterval(LIVE.beatT);
        if (Date.now() - LIVE.heard > 25000){ LIVE.ws = null; ws.onclose = null; try { ws.close(); } catch (e) {} return lost(true); }
        try { ws.send("ping"); } catch (e) {}
        // v0.36 (DEV-294): on the end screen, ask again who is here, so "Your friend left." shows when they go home (the
        // server's goodbye broadcast counted the closing socket until v0.41; the poll stays as a fallback, e.g. for a
        // server not yet redeployed). An existing message; nothing new for the server
        if (phase === "over") send({ t: "hello", moveSeq: LIVE.moveSeq });
      }, 10000);
    };
    ws.onmessage = e => { if (LIVE.ws !== ws) return; LIVE.heard = Date.now(); if (e.data === "pong") return; let m; try { m = JSON.parse(e.data); } catch (x) { return; } onServer(m); };
    ws.onclose = ev => {
      clearTimeout(openT); if (LIVE.ws !== ws) return; LIVE.ws = null; clearInterval(LIVE.beatT);
      if (ev.code === 4004){ forgetGame(LIVE.code); return liveFail("This game was deleted after 30 days with no moves."); }
      lost(opened);
    };
  }
  async function lost(wasOpen){
    if (!LIVE.code || LIVE.fail) return;
    LIVE.tries++;
    if (!wasOpen && LIVE.tries >= 2){ // never got in: ask whether the game is still there, and whether we're in it
      const r = await api(`/games/${LIVE.code}?token=${LIVE.token}`);
      if (!LIVE.code || LIVE.fail || LIVE.ws) return;
      if (r && r.status === 404){ forgetGame(LIVE.code); return liveFail(`There's no game ${LIVE.code} any more.`); }
      if (r && r.status === 403){ forgetGame(LIVE.code); return liveFail("This phone isn't a player in that game any more."); }
    }
    LIVE.note = LIVE.tries > 5 ? "Can't reach the game server. Reconnecting…" : "Reconnecting…";
    render();
    const wait = Math.min(10000, 400 * 2 ** Math.min(LIVE.tries, 6)) * (0.8 + Math.random() * 0.4);
    clearTimeout(LIVE.retryT); LIVE.retryT = setTimeout(connect, LIVE.tries === 1 ? 150 : wait);
  }
  // back in the app (unlocked the phone, switched back): reconnect now, or ask for the latest if the socket survived
  function resume(){
    if (mode !== "live" || !LIVE.code || LIVE.fail || document.visibilityState === "hidden") return;
    if (LIVE.ws && LIVE.ws.readyState === 1){ LIVE.heard = Date.now(); send({ t: "hello", moveSeq: LIVE.moveSeq }); }
    else if (!LIVE.ws){ LIVE.tries = 0; connect(); }
  }
  document.addEventListener("visibilitychange", resume);
  window.addEventListener("pageshow", resume);
  window.addEventListener("online", resume);
  function onServer(m){
    if (m.t === "error"){ info = "That didn't go through. Here is the game as it is."; return; } // a sync follows
    if (m.t !== "sync" && m.t !== "turn") return;
    queue(() => {
      const moved = m.t === "turn" && m.before && m.moveSeq !== LIVE.moveSeq;
      const friend = (m.seat === "host" ? "guest" : "host"), still = m.t === "sync" && phase === "over" && m.phase === "over" && state && m.moveSeq === LIVE.moveSeq && !!(m.online || {})[friend] === !!LIVE.online[friend];
      if (still) return; // the end screen's check found nothing new: no re-render
      Object.assign(LIVE, { seat: m.seat, host: m.seat === "host", hostSide: m.hostSide, guestIn: m.guestIn, online: m.online || {}, ready: m.ready, note: null, fail: null, moveSeq: m.moveSeq });
      me = m.you; document.body.classList.toggle("me-ai", me === "AI");
      rememberGame(LIVE.code, { token: LIVE.token, seat: m.seat, moveSeq: m.moveSeq, seenOver: m.phase === "over" });
      busy = false; lastFight = m.lastFight || null;
      if (m.phase === "lobby" || !m.s){ phase = "lobby"; state = null; lastFight = null; sel = null; return render(); }
      if (phase !== m.phase || !state){ sel = null; dcPick = false; info = null; }
      if (moved){ // the move you haven't seen yet (theirs, or yours coming back): play it in from the board before it
        sel = null; copyMode = false; info = null; LIVE.played = (LIVE.played || 0) + 1;
        state = m.before; phase = "play"; render(); state = m.s;
        return afterMove(m.before);
      }
      if (phase === "setup" && m.phase === "setup" && state && !LIVE.ready[me]){ // keep the lineup you're arranging
        for (const p of m.s.pieces){ const mine = p.side === me && state.pieces.find(x => x.id === p.id); if (mine){ p.r = mine.r; p.c = mine.c; } }
        if (me === "H" && state.dc) m.s.dc = state.dc;
        m.s.forms = { ...m.s.forms, [me]: state.forms[me] };
      }
      state = m.s; phase = m.phase; reselect(); render();
    });
  }
  // v0.42 (DEV-300): a sync swaps in a new state, so the picked piece is looked up again by id in it. Kept, a tap on an
  // empty square moved the old state's piece object (the move was lost) and a tap on another of yours put two on one square.
  // Gone, or not yours to move any more (your setup is in, it isn't your turn): nothing is picked.
  function reselect(){
    if (!sel) return;
    const p = state.pieces.find(x => x.id === sel.id && x.side === me && x.r >= 0);
    const open = phase === "setup" ? !LIVE.ready[me] : phase === "play" && state.turn === me;
    if (p && open){ sel = p; return; }
    sel = null; copyMode = false; if (phase === "play") info = null;
  }
  // the lobby: the code to share, who plays which side, switch sides, start
  function renderLobby(){
    const you = liveYou(), dot = on => `<i class="on ${on ? "yes" : ""}" title="${on ? "here" : "away"}"></i>`;
    const sideRow = (side, who, here) => `<div class="rule"><div class="k ${side === "H" ? "b" : "a"}">${side === "H" ? "🕵️" : "🧠"}</div><div><b>${who}</b> ${who === "You" ? "play" : "plays"} ${here == null ? SIDE_NAME[side] : `<span class="nw">${SIDE_NAME[side]} ${dot(here)}</span>`}</div></div>`;
    const friend = LIVE.host ? "guest" : "host";
    let body;
    if (LIVE.fail) body = `<div class="eyebrow">Play a friend</div><h1>${LIVE.full ? "GAME FULL" : "NO GAME"}</h1><p>${LIVE.fail}</p>${LIVE.full || !LIVE.code ? "" : `<button class="primary" id="lvretry">TRY AGAIN</button>`}<button class="ghost" id="lvleave">BACK</button>`;
    else if (phase === "joining") body = `<div class="eyebrow">Play a friend${LIVE.code ? " · " + LIVE.code : ""}</div><h1>${LIVE.opened ? "RECONNECTING" : "CONNECTING"}<span class="dots"><i>.</i><i>.</i><i>.</i></span></h1><p>${LIVE.note || "Reaching the game server."}</p><button class="ghost" id="lvleave">BACK</button>`;
    else if (!LIVE.guestIn) body = `<div class="eyebrow">Play a friend · invite</div><p class="codebig" id="code">${LIVE.code}</p>
      <p>Send your friend the link, or they type <b>${LIVE.code}</b> under Join with code.</p>
      <div class="row2"><button class="primary" id="lvshare">SHARE</button><button class="ghost" id="lvcopy">COPY</button></div>
      <div class="rules">${sideRow(you, "You")}</div>${LIVE.note ? `<p class="lvnote">${LIVE.note}</p>` : ""}<div class="row2"><button class="ghost" id="lvswap">SWITCH SIDES</button><button class="ghost" id="lvleave">BACK</button></div>`;
    else body = `<div class="eyebrow">Play a friend · ${LIVE.code}</div><h1>${LIVE.host ? "YOUR FRIEND IS IN" : "YOU'RE IN"}</h1>
      <div class="rules">${sideRow(you, "You")}${sideRow(other(you), LIVE.host ? "Your friend" : "The host", !!LIVE.online[friend])}</div>
      <button class="ghost" id="lvswap">SWITCH SIDES</button>
      ${LIVE.host ? `<button class="primary" id="lvstart">START</button>` : `<p class="eyebrow" id="lvwait">Waiting for the host to start<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>`}
      ${LIVE.note ? `<p class="lvnote">${LIVE.note}</p>` : ""}<button class="ghost" id="lvleave">BACK</button>`;
    app.innerHTML = `<div class="overlay"><div class="card lobby">${body}</div></div>`;
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
    on("lvshare", async () => { sfx.tap(); const url = inviteLink(); try { if (navigator.share) await navigator.share({ title: "Kill Switch", text: `Play Kill Switch with me. Code ${LIVE.code}`, url }); else { await navigator.clipboard.writeText(url); toastLobby("Link copied"); } } catch (e) {} });
    on("lvcopy", async () => { sfx.tap(); try { await navigator.clipboard.writeText(inviteLink()); toastLobby("Link copied"); } catch (e) { toastLobby(inviteLink()); } });
    on("lvswap", () => { sfx.tap(); if (!send({ t: "swap" })) toastLobby("Not connected. Reconnecting…"); });
    on("lvstart", () => { sfx.win(); if (!send({ t: "start", hostSide: LIVE.hostSide })) toastLobby("Not connected. Reconnecting…"); });
    on("lvleave", () => { sfx.tap(); leaveLive(); phase = "intro"; render(); });
    on("lvretry", () => { sfx.tap(); const code = LIVE.code; LIVE.fail = null; openGame(code); });
  }
  function toastLobby(text){ const c = app.querySelector(".card"); if (!c) return; const p = document.createElement("p"); p.className = "eyebrow"; p.textContent = text; c.appendChild(p); setTimeout(() => p.remove(), 1600); }
  // the start screen's list of this phone's games, with whose turn it is (asked of the server; the list works offline too)
  function renderMyGames(){
    const box = document.getElementById("mygames"); if (!box) return;
    const list = myGames();
    if (!list.length){ box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<div class="eyebrow">My games</div>` + list.map(g => `<button class="game" data-code="${g.code}"><span class="gc">${g.code}</span><span class="gs" id="gs-${g.code}">…</span></button>`).join("");
    box.querySelectorAll(".game").forEach(b => b.addEventListener("click", () => { sfx.tap(); openGame(b.dataset.code); }));
    for (const g of list) api(`/games/${g.code}?token=${g.token}`).then(r => {
      const el = document.getElementById("gs-" + g.code); if (!el) return;
      if (r && (r.status === 404 || r.status === 403 || (r.status === 200 && r.body.phase === "over" && g.seenOver))){ forgetGame(g.code); const b = el.closest(".game"); if (b) b.remove(); if (!myGames().length) box.hidden = true; return; } // gone, or finished and seen: off the list
      if (!r || r.status !== 200){ el.textContent = "offline"; return; }
      const s = r.body, side = s.you === "H" ? "Humans" : "AI";
      el.innerHTML = s.phase === "over" ? `<b>game over</b> · ${s.winner === s.you ? "you won" : s.winner === "D" ? "a draw" : "you lost"}` : s.phase === "lobby" ? (s.guestIn ? "in the lobby" : "waiting for your friend") : s.phase === "setup" ? (s.ready[s.you] ? "waiting for their setup" : `<b>set up</b> · ${side}`) : s.yourTurn ? `<b>your move</b> · ${side}` : `their move · ${side}`;
    });
  }
  if (params.has("trace")) window.__ksRender = () => render(); // tests only (v0.41): a render mid-drag, as a server sync would do
  if (params.has("trace")) window.__ks = () => ({ state, me, phase, busy, sel, mode, ready: LIVE.ready, hostSide: LIVE.hostSide, host: LIVE.host, code: LIVE.code, ws: !!LIVE.ws, online: LIVE.online, note: LIVE.note, moveSeq: LIVE.moveSeq, played: LIVE.played || 0 }); // tests only
  function botTurn(){
    if (mode !== "solo" || state.turn === me || state.winner) return; // live: a person plays the other side
    const m = levelMove(state, other(me), bot);
    if (!m) return afterMove(state);
    const before = state; state = apply(state, m);
    afterMove(before);
  }
  // test positions: this screen's side plays as MEDIUM, the bot's side at its level (&level=)
  const either = () => state.turn === me ? botMove : levelMove;
  if (params.has("over")){ start(); phase = "play"; while (!state.winner){ const m = either()(state, state.turn, bot); if (!m) break; state = apply(state, m); } phase = "over"; render(); }
  else if (params.has("battle") || params.has("until")){
    const want = params.get("until") || "fight";
    start("solo", params.get("side") === "AI" ? "AI" : "H"); phase = "play"; let n = 0, before = state; // &side=AI views it as the AI
    while (!state.winner && n++ < 400){ const m = either()(state, state.turn, bot); if (!m) break; before = state; state = apply(state, m); if (state.events.some(e => e.kind === want || e.result === want)) break; } // &until=trapped: a result works too
    const after = state; state = before; render(); state = after; afterMove(before);
  }
  else if (params.has("play")) start("solo", params.get("side") === "AI" ? "AI" : "H");
  else if (params.has("g")) openGame(params.get("g")); // an invite link, or a game from My games
  else render();
}
</script>
</body>
