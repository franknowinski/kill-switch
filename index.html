<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kill Switch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14;--panel:#121923;--line:#223041;--line2:#2C3D52;--fg:#E6EDF3;--muted:#8A9BB0;
  --blue:#5CC8FF;--blue-bg:#10263A;--ink:#06121C;
  --amber:#F5A524;--amber-bg:#2A1C08;--amber-line:#6B4A12;
  --red:#FF5C5C;--green:#3DDC84;
  --display:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-family:var(--display);font-size:28px;margin:0;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;gap:8px}
.top .t{font-family:var(--display);font-size:20px;letter-spacing:1px;white-space:nowrap}
.stat{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.5}
.stat b{color:var(--fg);font-size:14px;letter-spacing:0}
.lvl{display:flex;align-items:center;gap:8px;padding:0 16px 6px}
.lvl .bar{flex:1;height:8px;border-radius:4px;background:var(--panel);border:1px solid var(--amber-line);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.lvl span{font-size:11px;letter-spacing:1px;color:var(--amber);text-transform:uppercase;white-space:nowrap}
.boardwrap{position:relative;margin:0 16px}
/* flat board; the .zoom layer scales around the fight square for the battle close-up */
.zoom{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;aspect-ratio:1;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.sq{position:relative;border-radius:7px;background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 2px 5px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:clamp(14px,4.6vw,22px);min-width:0;padding:0;color:var(--fg)}
.sq.block{background:#070A0E;border-color:#0f151d}
.sq.ai{color:var(--amber)}.sq.h{color:var(--blue)}
.sq.can{box-shadow:inset 0 0 0 3px rgba(92,200,255,.55)}
.sq.can.ai{box-shadow:inset 0 0 0 3px var(--red)}
.sq.copy{box-shadow:inset 0 0 0 3px var(--green)}
.sq.scan{box-shadow:inset 0 0 0 3px var(--green)}
.sq.last{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.sq.over{background:#1a2a3a}
/* the token: a card with a darker side under it and a soft shadow */
.pz,.clone{position:absolute;inset:4% 7% 12% 7%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;isolation:isolate;will-change:transform;transition:transform .15s,translate .15s,scale .15s;box-shadow:0 7px 10px rgba(0,0,0,.55);border-top-color:rgba(255,255,255,.22)!important}
.pz::before,.clone::before{content:"";position:absolute;inset:-1px;border-radius:6px;z-index:-1;transform:translateY(5px);background:var(--side,#0a1826);border:1px solid var(--sideline,#163a55);border-bottom-width:2px}
.sq.h .pz,.clone.h{background:linear-gradient(180deg,#143353,var(--blue-bg));border:1px solid #2a6a96;color:var(--blue);--side:#0a1826;--sideline:#163a55}
.sq.ai .pz,.clone.ai{background:linear-gradient(180deg,#3a2708,var(--amber-bg));border:1px solid var(--amber-line);color:var(--amber);--side:#1a1105;--sideline:#4a3309}
.sq.asi .pz{box-shadow:0 0 0 2px var(--red),0 0 14px rgba(255,92,92,.7)}
.sq .q,.clone .q{color:var(--amber);opacity:.85}.sq.h .q,.clone.h .q{color:var(--blue)}
.sq.sel .pz{translate:0 -5px;scale:1.12;box-shadow:0 12px 14px rgba(0,0,0,.55),0 0 18px rgba(92,200,255,.45)}
.sq.h:not(.sel) .pz.idle{animation:breathe 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -2px}}
.sq .ic,.clone .ic{font-size:.85em;line-height:1}
.sq .n,.clone .n{position:absolute;right:6%;bottom:-2%;font-size:.58em}
.pz.drag{transition:none;pointer-events:none;scale:1.15;box-shadow:0 0 22px rgba(92,200,255,.5)}
.sq.can{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(92,200,255,.35)}50%{box-shadow:inset 0 0 0 3px rgba(92,200,255,.9)}}
.sq.can.ai{animation:pulser 1.1s ease-in-out infinite}
@keyframes pulser{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,92,92,.4)}50%{box-shadow:inset 0 0 0 3px rgba(255,92,92,1)}}
.pz.reveal,.clone.reveal{animation:flipin .45s ease-out}
@keyframes flipin{0%{transform:rotateY(90deg) scale(.8)}60%{transform:rotateY(-15deg) scale(1.08)}100%{transform:none}}
.sq.turned .pz{animation:turnflash .7s ease-out}
@keyframes turnflash{0%{filter:brightness(1)}30%{filter:brightness(2.2) saturate(2)}100%{filter:brightness(1)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.clone{font-size:clamp(14px,4.6vw,22px)}
.burst{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 0 0 rgba(245,165,36,.9),0 0 0 0 rgba(255,92,92,.7);animation:burst .45s ease-out forwards}
.burst.big{animation-duration:.8s;--s:12}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(var(--s,6));box-shadow:0 0 0 14px rgba(245,165,36,0),0 0 0 26px rgba(255,92,92,0)}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--amber);animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle,rgba(245,165,36,.4),transparent 70%);animation:flashout .6s ease-out forwards}
.board.shake{animation:shake .4s}.board.shake.big{animation:shakebig .6s}
@keyframes shakebig{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(9px,-4px)}45%{transform:translate(-7px,2px)}60%{transform:translate(7px,-2px)}80%{transform:translate(-3px,0)}}
.dots i{font-style:normal;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
body.won .board{animation:shake .5s}body.lost .board{animation:shake .5s}
body.won::after,body.lost::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;animation:flashout 1.1s ease-out forwards}
body.won::after{background:radial-gradient(circle,rgba(61,220,132,.35),transparent 70%)}
body.lost::after{background:radial-gradient(circle,rgba(255,92,92,.4),transparent 70%)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(4px,0)}}
@keyframes flashout{from{opacity:1}to{opacity:0}}
.ghost.sm{flex:0 0 52px}
.msg{min-height:40px;margin:8px 16px 0;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.4}
.msg b{color:var(--amber)}
.msg .you{color:var(--blue)}.msg .them{color:var(--amber)}
body.me-ai .msg .you,body.me-ai .you{color:var(--amber)}body.me-ai .msg .them{color:var(--blue)}body.me-ai .msg b{color:var(--blue)}
.link{margin:8px 16px 0;padding:8px 10px;border-radius:10px;background:#0d131b;border:1px solid var(--line);font-size:10.5px;color:var(--muted);word-break:break-all;max-height:64px;overflow:auto;user-select:all}
.row2{display:flex;gap:8px}.row2 .ghost{font-size:13px}
.two p{color:var(--muted)}.two{display:flex;flex-direction:column;gap:8px}.two[hidden]{display:none}
.paste{width:100%;min-height:64px;background:#0d131b;color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:8px;font:inherit;font-size:12px}
.msg.over{border-width:2px;display:flex;flex-direction:column;gap:6px}
.msg.over h1{font-size:24px}.msg.over.win{border-color:var(--green)}.msg.over.lose{border-color:var(--red)}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:6px;font-weight:600;font-size:13px;flex-shrink:0}
.pc.h{background:var(--blue-bg);border:1px solid #1f4b6b;color:var(--blue)}
.pc.ai{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber)}
.actions{display:flex;gap:10px;padding:8px 16px 4px}
.ghost{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:transparent;font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:15px}
.ghost[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:#0d2418}
.ghost:disabled{opacity:.4}
.primary{flex:1;min-height:52px;border-radius:14px;border:0;background:var(--blue);color:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:5}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card p{margin:0;font-size:14px;line-height:1.5}
.rules{display:grid;gap:8px;margin:2px 0}
.rule{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.35}
.rule .k{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rule .k.b{background:var(--blue-bg);border:1px solid #1f4b6b}
.rule .k.a{background:var(--amber-bg);border:1px solid var(--amber-line)}
.key{padding:10px 16px 28px;display:flex;flex-direction:column;gap:4px}
.kh{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.kh.b{color:var(--blue)}.kh.a{color:var(--amber)}.kh.n{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:12.5px;line-height:1.45;margin-top:14px}
.kr{display:grid;grid-template-columns:auto minmax(72px,auto) 1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;background:#0d131b;border:1px solid #182230;font-size:13px;cursor:pointer}
.kr .pc{min-width:30px;height:28px;font-size:15px;white-space:nowrap;padding:0 6px}
.kr .pc.tok{position:relative;width:34px;padding:0}.kr .pc.tok .ic{font-size:15px}.kr .pc.tok .n{position:absolute;right:3px;bottom:0;font-size:9px;font-weight:700}
.kr .lv{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#182230;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.5px;vertical-align:1px}
.kr .kn{font-weight:600;white-space:nowrap}
.kr .kp{color:var(--muted);font-size:12px;line-height:1.3}
.kc{font-weight:600;font-size:13px;white-space:nowrap}.kc i{font-style:normal;color:var(--muted);font-weight:400;font-size:11px}
.kr.gone{opacity:.35}.kr.gone .pc{filter:grayscale(1)}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ranks .kr{grid-template-columns:auto 1fr auto;padding:4px 8px}.ranks .kr .kp{display:none}
.seen{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);padding:2px 8px 4px}
.seen .pc{min-width:24px;height:22px;font-size:12px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
pre{white-space:pre-wrap;padding:16px;font-size:13px}
/* battle card: the two numbers, big, at the moment of impact; the winner grows, the loser drops out */
.vsc{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 24px 10px;border-radius:14px;background:#0E141Cf4;border:1px solid var(--line2);box-shadow:0 14px 36px rgba(0,0,0,.7);animation:vsin .14s ease-out}
.vsc.below{transform:translate(-50%,0)}
@keyframes vsin{from{opacity:0;scale:.7}}
.vsc .row{display:flex;align-items:center;gap:14px}
.vsc .pc{min-width:48px;height:46px;font-size:27px;border-radius:10px;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s,filter .22s}
.vsc .vt{font-size:11px;color:var(--muted);letter-spacing:1px}
.vsc .res{font-family:var(--display);font-size:15px;letter-spacing:1.5px;min-height:18px;opacity:0;transition:opacity .15s}
.vsc.done .res{opacity:1}
.vsc .res.w{color:var(--green)}.vsc .res.l{color:var(--red)}.vsc .res.n{color:var(--muted)}
.vsc .pc.won{transform:scale(1.3);box-shadow:0 0 0 2px var(--green),0 0 18px rgba(61,220,132,.6)}
.vsc .pc.out{transform:scale(.7);opacity:.35;filter:grayscale(1)}
.vsc.big{padding:18px 30px 12px;border-color:var(--amber)}.vsc.big .pc{min-width:62px;height:58px;font-size:36px}.vsc.big .res{font-size:19px}
.vsc.fade{animation:vsout .28s ease-in forwards}.vsc.below.fade{animation:vsoutb .28s ease-in forwards}
@keyframes vsout{to{opacity:0;transform:translate(-50%,-112%) scale(.94)}}
@keyframes vsoutb{to{opacity:0;transform:translate(-50%,12%) scale(.94)}}
/* alerts: level-ups and milestones slide in over the top of the board */
.toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.toast{padding:7px 14px;border-radius:999px;background:#2A1C08;border:1px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:13px;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:tin .25s ease-out, tout .5s ease-in forwards;animation-delay:0s,var(--hold,1.6s);white-space:nowrap}
.toast.big{font-size:17px;padding:12px 20px;background:#3a0f0f;border-color:var(--red);color:#fff;--hold:3.2s}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#app{display:flex;flex-direction:column;width:100%}
@media (min-width:860px){
  #app{flex-direction:row;align-items:flex-start;gap:32px;max-width:1140px;margin:0 auto;padding:20px 28px}
  .left{flex:0 0 auto;width:min(560px,calc(100dvh - 160px));position:sticky;top:20px}
  .right{flex:1;min-width:340px;max-width:480px}
  .boardwrap{margin:0}.board{gap:4px}.pz,.clone{border-radius:8px}
  .sq{font-size:24px;border-radius:9px}
  .top{padding:0 0 6px}.lvl{padding:0 0 10px}
  .top .t{font-size:24px}
  .msg{margin:0 0 10px;font-size:15px}.link{margin:0 0 10px}
  .actions{padding:0 0 10px}
  .key{padding:14px 0 24px}.ranks{grid-template-columns:1fr 1fr 1fr}
  .msg.over h1{font-size:28px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ENGINE-START
const COLS = 8, ROWS = 8;
const BLOCKED = new Set(["3,2","4,2","3,5","4,5"]);
const SETUP_ROWS = { H: [5,6,7], AI: [0,1,2] }; // every square in these rows is filled, like Stratego
// Tuning: everything that decides fairness is here.
const BAL = {
  RSI_EVERY: 8,     // the self-improver grows itself +1 every N rounds, no cap but MAX_STR
  MAX_STR: 9, SCANS: 2, COPIES: 2, MAX_ROUNDS: 100, // past MAX_ROUNDS the game is a draw
  AGI: 8, ASI: 9,   // milestone levels
};
// Types. F flag, T trap (honeypot / backdoor: converts the attacker; an M removes it), S slider (drone / crawler),
// M remover (engineer / hacker), C scanner (reveals adjacent hidden enemies), R replicator (cut in v0.11.27: nobody understood it; the engine still understands it),
// A auditor / virus (the spy: kills a piece at AGI level or above when attacking, else dies; both sides have one), I self-improver (drives the AI's growth;
// grows itself), K deepfake (the AI's bluff: fights as its number, but a scan or scanner sees a 7 until a fight shows it), X fighter.
// P persuader was cut in v0.11.13; the engine still understands it.
// 22 a side: flag, 3 traps, 3 sliders, 2 or 3 removers, scanners, specials, 9 fighters. Two front-row squares start empty.
const ARMIES = {
  H:  [["F",0],["T",0],["T",0],["T",0],["S",1],["S",1],["S",1],["M",3],["M",3],["M",3],["A",2],["C",2],["C",2],
       ["X",4],["X",4],["X",5],["X",5],["X",6],["X",6],["X",7],["X",8],["X",9]],
  AI: [["F",0],["T",0],["T",0],["T",0],["S",1],["S",1],["S",1],["M",3],["M",3],["I",2],["A",2],["C",2],["C",2],["K",3],
       ["X",4],["X",4],["X",5],["X",5],["X",6],["X",6],["X",7],["X",7]],
};
const GAPS = 2;
const LEVELS_UP = t => t !== "F" && t !== "T";
const COPYABLE = t => !["F","T","R","I"].includes(t);
// where a piece likes to start: higher = further back
const PLACE = { X: p => p.str, K: () => 3, S: () => 1, M: () => 2, A: () => 4, C: () => 3, R: () => 4, P: () => 3, I: () => 6 };
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
// Lineups: five per side, written back row first. Letters are piece types, digits fighters by strength (the nearest
// free number if that one is used up), "." an empty front square. Each is applied straight or mirrored, so a lineup's name
// doesn't give the whole setup away. The CTO and the self-improver stay on the back row in all of them.
const FORMATIONS = {
  H: [
    { name: "Fortress", hint: "Datacenter in the corner, walled in.", rows: ["FT89C57S", "T7MA6MC4", "S54.MTS."] },
    { name: "Keep", hint: "Datacenter in the middle, big numbers around it.", rows: ["S4TF798T", "5M7TSACM", "4C.6M5.S"] },
    { name: "Spearhead", hint: "Top agents up front. Attack early.", rows: ["FT9C4ST4", "T5CM6MSA", ".5877MS."] },
    { name: "Wall", hint: "Honeypots across the back, two fake flags.", rows: ["TFT98S7T", "M7MC6ACS", "54S.5M4."] },
    { name: "Bluff", hint: "Traps where a flag would be. The flag is elsewhere.", rows: ["T5S8C9TF", "4M7ACM6T", "S54.MS7."] },
  ],
  AI: [
    { name: "Fortress", hint: "Kill switch in the corner, walled in.", rows: ["FT6IC56S", "T6MA5MC4", "S4K.5TS."] },
    { name: "Keep", hint: "Kill switch in the middle, big numbers around it.", rows: ["S6TFTI6C", "5M5T6AC4", "4S.5MK.S"] },
    { name: "Spearhead", hint: "Top agents up front. Attack early.", rows: ["FT4CKSTI", "T54M5ASS", ".666C5M."] },
    { name: "Wall", hint: "Backdoors across the back, two fake switches.", rows: ["TFTSIC6T", "M6MC5A6S", "54S.5K4."] },
    { name: "Bluff", hint: "Traps where a switch would be. The switch is elsewhere.", rows: ["T5S6CITF", "4M6ACM5T", "S4K.5S6."] },
  ],
};
const FORM_ROWS = side => side === "H" ? [7,6,5] : [0,1,2]; // back, middle, front
function formationSpots(side, f, mine, mirror){
  const pool = mine.slice(), spots = new Map(), digits = [];
  f.rows.forEach((row, i) => [...row].forEach((ch, c) => {
    if (ch === ".") return;
    const sq = [FORM_ROWS(side)[i], mirror ? COLS - 1 - c : c];
    if (/\d/.test(ch)){ digits.push({ n: +ch, sq }); return; }
    const k = pool.findIndex(p => p.type === ch); if (k < 0) throw new Error("lineup " + f.name + ": no " + ch + " left");
    spots.set(pool.splice(k, 1)[0], sq);
  }));
  if (pool.some(p => p.type !== "X") || pool.length !== digits.length) throw new Error("lineup " + f.name + ": piece count");
  for (const exact of [true, false]) for (const d of digits){
    if (d.done) continue;

  function explain(p){
    p = face(p);
    const n = LEVELS_UP(p.type) ? `${ROLE[p.side][p.type]} ${p.str}` : ROLE[p.side][p.type];
    return `<span class="${p.side === me ? "you" : "them"}">${n[0].toUpperCase() + n.slice(1)}.</span> ${ABOUT[p.type](p)}${p.side === me && sel && legalMoves(state, p).length ? " Lit squares are where it can go; red means a fight." : ""}`;
  }
  function tap(r, c){
    if (busy) return;
    const p = at(state, r, c);
    if (phase === "setup"){
      if (sel && !p && SETUP_ROWS[me].includes(r) && !BLOCKED.has(r+","+c)){ sfx.move(); sel.r = r; sel.c = c; sel = null; return render(); }
      if (!p || p.side !== me) return;
      if (!sel){ sfx.tap(); sel = p; return render(); }
      if (sel.id !== p.id){ sfx.move(); const t = [sel.r, sel.c]; sel.r = p.r; sel.c = p.c; p.r = t[0]; p.c = t[1]; }
      sel = null; return render();
    }
    if (phase !== "play" || state.turn !== me) return;
    if (scanMode){
      if (p && p.side !== me && !p.revealed && state.scans[me] > 0){ p.revealed = true; state.scans[me]--; state.log = `${me === "H" ? "Scan" : "Hack"}: ${name(face(p))} at ${sqName(p.r, p.c)}.`; state.history.push({ round: state.round, side: me, text: state.log }); scanMode = false; info = null; sfx.reveal(); }
      return render();
    }
    if (p && p.side === me){ sfx.tap(); sel = sel && sel.id === p.id ? null : p; copyMode = false; info = sel ? explain(sel) : null; return render(); }
    if (p && p.side !== me && p.revealed && !sel){ sfx.tap(); info = explain(p); return render(); }
    if (sel){
      const mv = legalMoves(state, sel).find(m => m.to[0] === r && m.to[1] === c && !!m.copy === copyMode);
      if (mv){ const before = state; state = apply(state, { p: sel, ...mv }); sel = null; copyMode = false; info = null; afterMove(before).then(() => { if (state.winner) return; if (mode === "pass"){ phase = "handoff"; render(); } else setTimeout(botTurn, FAST ? 0 : 420); }); }
    }
  }
  const wait = ms => new Promise(res => setTimeout(res, ms));
  const trace = k => { if (params.has("trace")) (window.__trace = window.__trace || []).push([k, Math.round(performance.now())]); }; // ?trace=1: fight timeline for testing
  // an animation's finished promise only settles while the page is visible; never let a fight hang on it
  const fin = (a, ms) => Promise.race([a.finished.catch(() => {}), wait(ms + 80)]);
  function rectOf(r, c){ const el = app.querySelector(`.sq[data-r="${r}"][data-c="${c}"]`); return el ? { left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight } : null; }
  function cloneAt(p, rect, show){
    const fx = document.getElementById("fx"); if (!fx) return null;
    const el = document.createElement("div"); el.className = `clone ${cls(p.side)}`;
    const in7 = rect.width * .07;
    el.style.left = (rect.left + in7) + "px"; el.style.top = (rect.top + in7) + "px"; el.style.width = (rect.width - 2 * in7) + "px"; el.style.height = (rect.height - 2 * in7) + "px";
    el.innerHTML = show ? faceHtml(p) : `<span class="q">?</span>`;
    fx.appendChild(el); return el;
  }
  // the attacker lunges into the defender; the loser shakes and shrinks away; then the board re-renders.
  // Bigger ranks, bigger fight: poke (1-3), clash (4-6), showdown (7+) by the higher rank in the fight.
  function fightTier(a, d){ const m = Math.max(a.type === "X" || LEVELS_UP(a.type) ? a.str : 0, d.type === "X" || LEVELS_UP(d.type) ? d.str : 0); return m >= 7 ? 2 : m >= 4 ? 1 : 0; }
  function sparks(x, y){ const fx = document.getElementById("fx"); for (let i = 0; i < 14; i++){ const s = document.createElement("div"); s.className = "spark"; const ang = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50; s.style.left = x + "px"; s.style.top = y + "px"; s.style.setProperty("--dx", Math.cos(ang) * d + "px"); s.style.setProperty("--dy", Math.sin(ang) * d + "px"); s.style.animationDelay = (Math.random() * .1) + "s"; fx.appendChild(s); setTimeout(() => s.remove(), 900); } }
  function shakeBoard(big){ const b = document.getElementById("board"); if (!b) return; b.classList.remove("shake", "big"); void b.offsetWidth; b.classList.add("shake"); if (big) b.classList.add("big"); }
  let lastCard = null;
  async function animateFight(before, ev){
    const a = before.pieces.find(x => x.r === state.last.from[0] && x.c === state.last.from[1]);
    const d = before.pieces.find(x => x.r === ev.r && x.c === ev.c);
    const ra = rectOf(a.r, a.c), rd = rectOf(ev.r, ev.c);
    if (!ra || !rd) return;
    const tier = fightTier(a, d);
    const sqA = app.querySelector(`.sq[data-r="${a.r}"][data-c="${a.c}"]`), sqD = app.querySelector(`.sq[data-r="${ev.r}"][data-c="${ev.c}"]`);
    const masked = x => x.side !== me && (!x.revealed || face(x) !== x);
    const ca = cloneAt(face(a), ra, a.side === me || a.revealed), cd = cloneAt(face(d), rd, d.side === me || d.revealed);
    for (const sq of [sqA, sqD]){ const pz = sq && sq.querySelector(".pz"); if (pz) pz.style.visibility = "hidden"; }
    const dx = rd.left - ra.left, dy = rd.top - ra.top;
    if (tier === 2) await wait(200);
    const lunge = [160, 200, 420][tier];
    await fin(ca.animate([{ transform: "none" }, { transform: `translate(${dx * 0.7}px,${dy * 0.7}px) scale(1.12)` }], { duration: lunge, easing: tier === 2 ? "ease-in" : "cubic-bezier(.4,0,1,1)", fill: "forwards" }), lunge);
    sfx.hit(); if (tier === 2) sfx.big();
    const fx = document.getElementById("fx");
    const bx = rd.left + rd.width / 2, by = rd.top + rd.height / 2;
    const burst = document.createElement("div"); burst.className = "burst" + (tier === 2 ? " big" : ""); burst.style.left = bx + "px"; burst.style.top = by + "px";
    fx.appendChild(burst); setTimeout(() => burst.remove(), 900);
    if (tier >= 1) shakeBoard(tier === 2);
    if (tier === 2){ sparks(bx, by); const fl = document.createElement("div"); fl.className = "flash"; document.body.appendChild(fl); setTimeout(() => fl.remove(), 700); }
    // reveal the hidden one at the moment of impact
    if (masked(a)) { ca.innerHTML = faceHtml(a); ca.classList.add("reveal"); }
    if (masked(d)) { cd.innerHTML = faceHtml(d); cd.classList.add("reveal"); }
    const card = vsCard(ev, tier); lastCard = card;
    if (tier === 2) await wait(300); // freeze on impact
    setTimeout(() => vsResolve(card, ev), [520, 560, 700][tier]); // long enough to read both numbers first
    const r = ev.result;
    const aDies = r === "lose" || r === "tie", dDies = r === "win" || r === "flag" || r === "defuse" || r === "tie";
    const dur = [260, 320, 600][tier];
    const anims = [];
    if (dDies) anims.push(fin(cd.animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "scale(.3) rotate(20deg) translateZ(60px)", opacity: 0 }], { duration: dur, easing: "ease-in", fill: "forwards" }), dur));
    else cd.animate([{ transform: "translateX(0)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none" }], { duration: 220 });
    if (aDies) anims.push(fin(ca.animate([{ transform: `translate(${dx * 0.7}px,${dy * 0.7}px) scale(1.12)` }, { transform: `translate(${dx * 0.4}px,${dy * 0.4}px) scale(.3) rotate(-20deg) translateZ(60px)`, opacity: 0 }], { duration: dur, easing: "ease-in", fill: "forwards" }), dur));
    else if (r === "trapped") anims.push(fin(ca.animate([{ transform: `translate(${dx * 0.7}px,${dy * 0.7}px) scale(1.12)` }, { transform: `translate(${dx * 0.7}px,${dy * 0.7}px) scale(1.12) rotateY(180deg)` }], { duration: 300, fill: "forwards" }), 300));
    else anims.push(fin(ca.animate([{ transform: `translate(${dx * 0.7}px,${dy * 0.7}px) scale(1.12)` }, { transform: `translate(${dx}px,${dy}px) scale(1)` }], { duration: 160, easing: "ease-out", fill: "forwards" }), 160));
    await Promise.all(anims);
    const you = a.side === me;
    const good = r === "tie" ? null : r === "trapped" ? !you : (!aDies) === you;
    if (good === true) sfx.win(); else if (good === false) sfx.lose();
    ca.remove(); cd.remove();
    return new Set([String(a.id), String(d.id)]);
  }
  async function afterMove(before){
    info = null;
    const events = state.events;
    if (state.winner) phase = "over";
    const fight = events.find(e => e.kind === "fight");
    let skip = null;
    if (fight && !FAST){ busy = true; skip = await animateFight(before, fight); }
    else if (!FAST && state.last && !events.some(e => e.kind === "copy")) sfx.move();
    render({ skip });
    if (FAST) return;
    if (fight){ if (lastCard && lastCard.done && !params.has("hold")) await lastCard.done; lastCard = null; camOut(); trace("zoom out"); await wait(CAM_OUT + 40); busy = false; trace("board free, AI may move"); }
    for (const e of events){
      if (e.kind === "reveal") sfx.reveal();
      if (e.kind === "rsi"){ toast("🧠 the self-improver grew"); sfx.level(); }
      if (e.kind === "agi"){ toast("THE AI HAS REACHED AGI", true); sfx.big(); }
      if (e.kind === "asi"){ toast("SUPERINTELLIGENCE · it can't hide now", true); sfx.big(); }
    }
    if (state.winner){
      const win = state.winner === me;
      if (state.winner === "D") sfx.level();
      else { document.body.classList.add(win ? "won" : "lost"); setTimeout(() => document.body.classList.remove("won", "lost"), 1200); win ? sfx.gameWin() : sfx.gameLose(); }
    }
  }
  function toast(text, big){
    const box = document.getElementById("toasts"); if (!box) return;
    const el = document.createElement("div"); el.className = "toast" + (big ? " big" : ""); el.textContent = text;
    if (params.has("hold")) el.style.setProperty("--hold", "999s");
    box.appendChild(el); setTimeout(() => el.remove(), params.has("hold") ? 1e9 : big ? 3800 : 2200);
  }
  // the battle card: shown at impact with both pieces face up; resolve() marks the winner; it fades on its own
  function vsCard(ev, tier){
    const sq = app.querySelector(`.sq[data-r="${ev.r}"][data-c="${ev.c}"]`); if (!sq) return null;
    const b = sq.getBoundingClientRect();
    const el = document.createElement("div"); el.className = "vsc" + (tier === 2 ? " big" : "");
    if (b.top < 150){ el.classList.add("below"); el.style.top = (b.bottom + 6) + "px"; } else el.style.top = (b.top - 6) + "px";
    el.innerHTML = `<div class="row">${chip(ev.a).replace("pc ", "pc a ")}<span class="vt">vs</span>${chip(ev.d).replace("pc ", "pc d ")}</div><div class="res"></div>`;
    document.body.appendChild(el); trace("card: both numbers");
    const half = el.offsetWidth / 2 + 8;
    el.style.left = Math.min(Math.max(b.left + b.width / 2, half), window.innerWidth - half) + "px";
    const life = params.has("hold") ? 1e9 : [1500, 1700, 2100][tier];
    el.done = new Promise(res => setTimeout(() => { trace("card fades"); el.classList.add("fade"); setTimeout(() => el.remove(), 300); res(); }, Math.min(life, 1e7)));
    return el;
  }
  function vsResolve(el, ev){
    if (!el) return;
    const a = ev.a, r = ev.result, you = a.side === me;
    const aWins = r === "win" || r === "flag" || r === "defuse" || r === "convert";
    const good = r === "tie" ? null : r === "trapped" ? !you : aWins === you;
    const word = r === "tie" ? "BOTH FALL" : r === "flag" ? (you ? "SHUT DOWN" : "IT GOT OUT") : r === "trapped" ? "SWITCHED SIDES" : r === "convert" ? "TURNED" : r === "defuse" ? "REMOVED" : good ? "YOU WIN" : "YOU LOSE";
    el.querySelector(".pc.a").classList.add(r === "tie" || r === "lose" || r === "trapped" ? "out" : "won");
    el.querySelector(".pc.d").classList.add(r === "tie" || aWins ? "out" : "won");
    const res = el.querySelector(".res"); res.textContent = word; res.className = "res " + (good === null ? "n" : good ? "w" : "l");
    el.classList.add("done"); trace("card: winner shown");
  }
  function botTurn(){
    if (mode !== "solo" || state.turn === me || state.winner) return;
    const m = botMove(state, other(me), bot);
    if (!m) return afterMove(state);
    const before = state; state = apply(state, m);
    afterMove(before);
  }
  if (params.has("over")){ start(); phase = "play"; while (!state.winner){ const m = botMove(state, state.turn, bot); if (!m) break; state = apply(state, m); } phase = "over"; render(); }
  else if (params.has("battle") || params.has("until")){
    const want = params.get("until") || "fight";
    start(); phase = "play"; let n = 0, before = state;
    while (!state.winner && n++ < 400){ const m = botMove(state, state.turn, bot); if (!m) break; before = state; state = apply(state, m); if (state.events.some(e => e.kind === want)) break; }
    const after = state; state = before; render(); state = after; afterMove(before);
  }
  else if (params.has("play")) start("solo", params.get("side") === "AI" ? "AI" : "H");
  else if (params.has("g") || /[#&]g=/.test(location.hash)) loadLink(params.get("g") || location.hash);
  else render();
}
</script>
