<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kill Switch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14;--panel:#121923;--line:#223041;--line2:#2C3D52;--fg:#E6EDF3;--muted:#8A9BB0;
  --blue:#5CC8FF;--blue-bg:#10263A;--ink:#06121C;
  --amber:#F5A524;--amber-bg:#2A1C08;--amber-line:#6B4A12;
  --red:#FF5C5C;--green:#3DDC84;
  --display:"Chakra Petch",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{overflow-x:clip} /* fight sparks and knock-offs fly past the edge for a moment: never let the page scroll sideways */
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:clip;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
h1{font-family:var(--display);font-size:28px;margin:0;letter-spacing:1px}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;gap:8px}
.top .t{font-family:var(--display);font-size:20px;letter-spacing:1px;white-space:nowrap}
.stat{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:right;line-height:1.5}
.stat b{color:var(--fg);font-size:14px;letter-spacing:0}
.lvl{display:flex;align-items:center;gap:8px;padding:0 16px 6px}
.lvl .bar{flex:1;height:8px;border-radius:4px;background:var(--panel);border:1px solid var(--amber-line);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--amber);transition:width .3s}
.lvl span{font-size:11px;letter-spacing:1px;color:var(--amber);text-transform:uppercase;white-space:nowrap}
.boardwrap{position:relative;margin:0 16px;touch-action:none}
/* .zoom holds the perspective; .tilt (inside) tilts the board and its fx layer together */
.zoom{position:relative;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;aspect-ratio:1;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.sq{position:relative;border-radius:7px;background:var(--panel);border:1px solid var(--line);box-shadow:inset 0 2px 5px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:clamp(14px,4.6vw,22px);min-width:0;padding:0;color:var(--fg)}
.sq.block{background:#070A0E;border-color:#0f151d}
.sq.ai{color:var(--amber)}.sq.h{color:var(--blue)}
.sq.can{box-shadow:inset 0 0 0 3px rgba(92,200,255,.55)}
.sq.can.ai{box-shadow:inset 0 0 0 3px var(--red)}
.sq.copy{box-shadow:inset 0 0 0 3px var(--green)}
.sq.scan{box-shadow:inset 0 0 0 3px var(--green)}
.sq.last{box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.sq.over{background:#1a2a3a}
/* ⚡ the power station: a faint bolt on the square; it lights up once the 🧠 is a 10 */
.sq.power::after{content:"⚡";position:absolute;font-size:.8em;opacity:.35;pointer-events:none}
.sq.power[data-id]::after{left:2px;top:0;font-size:.5em;opacity:.9;transform:translateZ(calc(var(--ph) + 2px))}
.sq.power.live{background:#2a2208;border-color:#8a6d12}.sq.power.live::after{opacity:1;animation:bolt 1.2s ease-in-out infinite}
@keyframes bolt{50%{filter:drop-shadow(0 0 6px #ffd84a)}}
.primary.cutbtn{background:#ffd84a;color:#1a1405;box-shadow:0 0 18px rgba(255,216,74,.45)}
/* tabletop (v0.17): the board tilts back like a table (the browser's own CSS 3D) and every piece is a raised block with sides.
   .tilt holds the board and the fx layer in one tilted plane, so fight stand-ins use the same coordinates as the squares. */
:root{--tilt:28deg;--ph:7px}
.zoom{perspective:1100px;perspective-origin:50% -40%}
.tilt{position:relative;transform-style:preserve-3d;transform:rotateX(var(--tilt));transform-origin:50% 100%;margin-top:-6%} /* the tilt leaves a gap above the far edge: pull it up */
.board,.sq,.fx{transform-style:preserve-3d}
.pz,.clone{position:absolute;transform-style:preserve-3d;pointer-events:none;font-weight:700}.pz{inset:0}
.clone{font-size:clamp(14px,4.6vw,22px)}
.shd{position:absolute;inset:18% 12% 6%;border-radius:8px;background:rgba(0,0,0,.6);filter:blur(3px);transform:translate3d(1px,3px,1px)}
.blk{position:absolute;inset:8% 9% 12%;transform-style:preserve-3d;transition:transform .15s}
.face{position:absolute;border-radius:6px}
.ftop{inset:0;transform:translateZ(var(--ph));display:flex;align-items:center;justify-content:center;line-height:1;transition:box-shadow .15s}
.ffr{left:2px;right:2px;bottom:0;height:var(--ph);transform-origin:bottom;transform:rotateX(-90deg);border-radius:0 0 6px 6px}
.flf{top:2px;bottom:2px;left:0;width:var(--ph);transform-origin:left;transform:rotateY(-90deg)}
.frt{top:2px;bottom:2px;right:0;width:var(--ph);transform-origin:right;transform:rotateY(90deg)}
.h .ftop{background:linear-gradient(180deg,#1a4068,var(--blue-bg));border:1px solid #2a6a96;color:var(--blue);border-top-color:#4f9fd0}
.h .ffr{background:linear-gradient(#0d2238,#071422)}.h .flf,.h .frt{background:#0a1a2b}
.ai .ftop{background:linear-gradient(180deg,#4a3209,var(--amber-bg));border:1px solid var(--amber-line);color:var(--amber);border-top-color:#a8761e}
.ai .ffr{background:linear-gradient(#2b1d06,#140d03)}.ai .flf,.ai .frt{background:#1f1504}
.ftop .ic{font-size:1.02em;line-height:1}
.ftop .n{position:absolute;right:3%;bottom:3%;font-size:.5em;padding:.08em .26em;border-radius:.4em;background:rgba(0,0,0,.5);font-weight:700;line-height:1.1}
.sq .q,.clone .q,.floater .q{color:var(--amber);opacity:.85}.sq.h .q,.clone.h .q{color:var(--blue)}
.sq.asi .ftop{box-shadow:0 0 0 2px var(--red),0 0 14px rgba(255,92,92,.8)}
.sq.sel .blk{transform:translateZ(12px) scale(1.08)}
.sq.sel .ftop{box-shadow:0 0 0 2px var(--blue),0 0 18px rgba(92,200,255,.6)}
body.me-ai .sq.sel .ftop{box-shadow:0 0 0 2px var(--amber),0 0 18px rgba(245,165,36,.6)}
.sq:not(.sel) .blk.idle:not(.reveal){animation:bob 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateZ(3px)}}
.pz.drag{visibility:hidden}
/* while dragging, a flat copy of the piece follows the finger above the table */
.floater{position:fixed;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:700;transform:translate(-50%,-50%) scale(1.15);box-shadow:0 14px 22px rgba(0,0,0,.6),0 0 22px rgba(92,200,255,.5)}
.floater.h{background:linear-gradient(180deg,#1a4068,var(--blue-bg));border:1px solid #2a6a96;color:var(--blue)}
.floater.ai{background:linear-gradient(180deg,#4a3209,var(--amber-bg));border:1px solid var(--amber-line);color:var(--amber);box-shadow:0 14px 22px rgba(0,0,0,.6),0 0 22px rgba(245,165,36,.5)}
.floater .n{position:absolute;right:4%;bottom:4%;font-size:.5em;padding:.08em .26em;border-radius:.4em;background:rgba(0,0,0,.5)}
.spk{position:absolute;width:6px;height:6px;margin:-3px;border-radius:2px;background:var(--amber);pointer-events:none}
.sq.can{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 3px rgba(92,200,255,.35)}50%{box-shadow:inset 0 0 0 3px rgba(92,200,255,.9)}}
.sq.can.ai{animation:pulser 1.1s ease-in-out infinite}
@keyframes pulser{0%,100%{box-shadow:inset 0 0 0 3px rgba(255,92,92,.4)}50%{box-shadow:inset 0 0 0 3px rgba(255,92,92,1)}}
.blk.reveal{animation:flip3d .5s cubic-bezier(.3,1.4,.5,1)} /* the idle bob skips a revealing block, or it would hide the flip */
@keyframes flip3d{0%{transform:translateZ(30px) rotateY(-90deg)}100%{transform:none}}
.sq.turned .ftop{animation:turnflash .7s ease-out}
@keyframes turnflash{0%{filter:brightness(1)}30%{filter:brightness(2.2) saturate(2)}100%{filter:brightness(1)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}


.flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(circle,rgba(245,165,36,.4),transparent 70%);animation:flashout .6s ease-out forwards}
.board.shake{animation:shake .4s}.board.shake.big{animation:shakebig .6s}
@keyframes shakebig{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(9px,-4px)}45%{transform:translate(-7px,2px)}60%{transform:translate(7px,-2px)}80%{transform:translate(-3px,0)}}
.dots i{font-style:normal;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.2}30%{opacity:1}}
body.won .board{animation:shake .5s}body.lost .board{animation:shake .5s}
body.won::after,body.lost::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;animation:flashout 1.1s ease-out forwards}
body.won::after{background:radial-gradient(circle,rgba(61,220,132,.35),transparent 70%)}
body.lost::after{background:radial-gradient(circle,rgba(255,92,92,.4),transparent 70%)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(4px,0)}}
@keyframes flashout{from{opacity:1}to{opacity:0}}
.ghost.sm{flex:0 0 52px}
.msg{min-height:40px;margin:8px 16px 0;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.4}
.msg b{color:var(--amber)}
.msg .you{color:var(--blue)}.msg .them{color:var(--amber)}
body.me-ai .msg .you,body.me-ai .you{color:var(--amber)}body.me-ai .msg .them{color:var(--blue)}body.me-ai .msg b{color:var(--blue)}
.link{margin:8px 16px 0;padding:8px 10px;border-radius:10px;background:#0d131b;border:1px solid var(--line);font-size:10.5px;color:var(--muted);word-break:break-all;max-height:64px;overflow:auto;user-select:all}
.row2{display:flex;gap:8px}.row2 .ghost{font-size:13px}
.two p{color:var(--muted)}.two{display:flex;flex-direction:column;gap:8px}.two[hidden]{display:none}
.paste{width:100%;min-height:64px;background:#0d131b;color:var(--fg);border:1px solid var(--line2);border-radius:10px;padding:8px;font:inherit;font-size:12px}
.msg.over{border-width:2px;display:flex;flex-direction:column;gap:6px}
.msg.over h1{font-size:24px}.msg.over.win{border-color:var(--green)}.msg.over.lose{border-color:var(--red)}
.pc{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:6px;font-weight:600;font-size:13px;flex-shrink:0}
.pc.h{background:var(--blue-bg);border:1px solid #1f4b6b;color:var(--blue)}
.pc.ai{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber)}
.actions{display:flex;gap:10px;padding:8px 16px 4px}
.ghost{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line2);background:transparent;font-family:var(--display);font-weight:700;letter-spacing:1px;font-size:15px}
.ghost[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:#0d2418}
.ghost:disabled{opacity:.4}
.primary{flex:1;min-height:52px;border-radius:14px;border:0;background:var(--blue);color:var(--ink);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:5}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;margin:auto}
.card p{margin:0;font-size:14px;line-height:1.5}
.rules{display:grid;gap:8px;margin:2px 0}
.rule{display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.35}
.rule .k{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rule .k.b{background:var(--blue-bg);border:1px solid #1f4b6b}
.rule .k.a{background:var(--amber-bg);border:1px solid var(--amber-line)}
.key{padding:10px 16px 28px;display:flex;flex-direction:column;gap:4px}
.kh{font-family:var(--display);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.kh.b{color:var(--blue)}.kh.a{color:var(--amber)}.kh.n{color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--mono);font-size:12.5px;line-height:1.45;margin-top:14px}
.kr{display:grid;grid-template-columns:auto minmax(72px,auto) minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;background:#0d131b;border:1px solid #182230;font-size:13px;cursor:pointer}
.kr .pc{min-width:30px;height:28px;font-size:15px;white-space:nowrap;padding:0 6px}
.kr .pc.tok{position:relative;width:34px;padding:0}.kr .pc.tok .ic{font-size:15px}.kr .pc.tok .n{position:absolute;right:3px;bottom:0;font-size:9px;font-weight:700}
.kr .lv{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#182230;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.5px;vertical-align:1px}
.kr .kn{font-weight:600;white-space:nowrap}
.kr .kp{color:var(--muted);font-size:12px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.kc{font-weight:600;font-size:13px;white-space:nowrap}.kc i{font-style:normal;color:var(--muted);font-weight:400;font-size:11px}
.kr.gone{opacity:.35}.kr.gone .pc{filter:grayscale(1)}
.ranks{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ranks .kr{grid-template-columns:auto minmax(0,1fr) auto;padding:4px 8px}.ranks .kr .kn{min-width:0;overflow:hidden;text-overflow:ellipsis}.ranks .kr .kp{display:none}
.seen{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);padding:2px 8px 4px}
.seen .pc{min-width:24px;height:22px;font-size:12px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
pre{white-space:pre-wrap;padding:16px;font-size:13px}
/* alerts: level-ups and milestones slide in over the top of the board */
.toasts{position:absolute;left:0;right:0;top:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4}
.toast{padding:7px 14px;border-radius:999px;background:#2A1C08;border:1px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:13px;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:tin .25s ease-out, tout .5s ease-in forwards;animation-delay:0s,var(--hold,1.6s);max-width:calc(100vw - 32px);text-align:center;text-wrap:balance}
.toast.big{font-size:17px;padding:12px 20px;background:#3a0f0f;border-color:var(--red);color:#fff;--hold:3.2s}
.toast.cut{background:#2a2208;border-color:#ffd84a;color:#ffd84a}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.9)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#app{display:flex;flex-direction:column;width:100%}
/* play screen (v0.19): small pills, a dock with the last fight, the message and the buttons, then the board.
   On a phone (v0.20) the dock sits on top and the board runs down to the bottom of the screen. */
.hud{display:none;gap:6px;align-items:center;padding:6px 8px 2px}
.pill{font:600 12px var(--mono);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:rgba(14,20,28,.88);border:1px solid var(--line2);white-space:nowrap}
.pill.am{color:var(--amber);border-color:var(--amber-line);background:linear-gradient(90deg,rgba(245,165,36,.22) var(--p,0%),rgba(14,20,28,.88) var(--p,0%))}
.dock{display:flex;flex-direction:column}
.fline{display:flex;gap:8px;align-items:center;margin:8px 16px 0;padding:6px 10px;border-radius:10px;background:#0d131b;border:1px solid var(--line);font-size:13px;color:var(--fg);text-align:left;width:auto;font-family:var(--mono)}
.fline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fline.none{visibility:hidden} /* holds its row before the first fight, so the board doesn't jump when it appears */.fline small{color:var(--muted);font-size:11px;flex-shrink:0}
.fline .you{color:var(--blue)}.fline .them{color:var(--amber)}body.me-ai .fline .you{color:var(--amber)}body.me-ai .fline .them{color:var(--blue)}
.more{display:none;text-align:center;font-size:12px;color:var(--muted);letter-spacing:1px;margin:14px 0 0}
/* after a fight the winner's number rises from the square and fades; never blocks a tap */
.float{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:44px;line-height:1;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.85),0 0 2px #000}
.float.h{color:var(--blue)}.float.ai{color:var(--amber)}.float.n{color:var(--fg)}.float .x{color:var(--muted);font-size:.6em;margin:0 .15em}.float .b{color:var(--blue)}.float .a{color:var(--amber)}
.lgs{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto;font-size:13px;line-height:1.4}
.lgs div{padding:4px 2px;border-bottom:1px solid #182230}.lgs i{font-style:normal;color:var(--muted);font-size:11px;margin-right:6px}.lgs .mile{color:var(--amber)}
@media (max-width:859px){
  /* the board fills the screen: no title block, squares taller than wide, a flatter tilt */
  .left{display:flex;flex-direction:column;height:calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));min-height:470px}
  .left .top,.left .lvl{display:none}
  .hud{display:flex}
  .hud{order:0}.dock{order:1}.boardwrap{order:2} /* the dock above the board, so the board's near edge is the screen's bottom */
  .boardwrap{flex:1;min-height:0;margin:2px 4px 0}
  .zoom,.tilt{height:100%}
  .zoom{perspective:1300px;perspective-origin:50% -30%}
  :root{--tilt:20deg;--ph:9px}
  .tilt{margin-top:0}
  .board{aspect-ratio:auto;height:100%;grid-template-rows:repeat(8,minmax(0,1fr))}
  .sq,.clone{font-size:clamp(15px,5.4vw,28px)}
  .dock{padding:2px 8px 4px;gap:6px}
  .dock .fline,.dock .msg,.dock .link{margin:0}
  /* a fixed-height dock: a longer message must not shrink the board under the finger between two taps */
  .dock .msg{min-height:0;height:calc(3 * 1.4em + 14px);overflow-y:auto;padding:7px 10px;font-size:13px;line-height:1.4}
  .dock .msg.over{height:auto}
  .dock .actions{padding:0}
  .dock .ghost,.dock .primary{min-height:44px}
  .more{display:block}
}
@media (min-width:860px){
  #app{flex-direction:row;align-items:flex-start;gap:32px;max-width:1140px;margin:0 auto;padding:20px 28px}
  .left{flex:0 0 auto;width:min(560px,calc(100dvh - 300px));position:sticky;top:20px}
  .dock .fline{margin:10px 0 0}
  .right{flex:1;min-width:340px;max-width:480px}
  .boardwrap{margin:0}.board{gap:4px}:root{--ph:9px}.tilt{margin-top:-1%}
  .sq{font-size:24px;border-radius:9px}
  .top{padding:0 0 6px}.lvl{padding:0 0 10px}
  .top .t{font-size:24px}
  .msg{margin:0 0 10px;font-size:15px}.link{margin:0 0 10px}
  .actions{padding:0 0 10px}
  .key{padding:14px 0 24px}
  .msg.over h1{font-size:28px}
}
.ranks .kr .kn{white-space:normal;overflow:visible;line-height:1.15} /* "red-teamer" breaks at its hyphen rather than being cut off */
@media (max-width:360px){.ranks .kr{gap:6px;padding:4px 6px}.ranks .kr .kn{font-size:12px}}
@media (prefers-reduced-motion:reduce){.blk.idle,.blk.reveal,.sq.can,.sq.can.ai,.sq.power.live::after,.sq.turned .ftop,.board.shake,.toast{animation:none!important}.blk{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ENGINE-START
const COLS = 8, ROWS = 8;
const BLOCKED = new Set(["3,2","4,2","3,5","4,5"]);
const SETUP_ROWS = { H: [5,6,7], AI: [0,1,2] }; // every square in these rows is filled, like Stratego
// Tuning: everything that decides fairness is here.
const BAL = {

    app.querySelectorAll(".sq.can,.sq.sel,.sq.copy").forEach(q => q.classList.remove("can", "sel", "copy")); // the choice is made: unlight the board
    const font = getComputedStyle(sqA).fontSize; ca.style.fontSize = cd.style.fontSize = font;
    const dx = rd.left - ra.left, dy = rd.top - ra.top, len = Math.hypot(dx, dy) || 1, L = len / (Math.abs(dx) / len * ra.width + Math.abs(dy) / len * ra.height); // L: the distance in squares (phone squares are taller than wide)
    const c = { ra, dx, dy, len, size: ra.width, x0: ra.left + ra.width / 2, y0: ra.top + ra.height / 2 };
    // where they meet: halfway for neighbours; a slider from afar crosses most of the way and meets just short of the defender
    const meet = (L - .5) / L, gap = .34 / L; // each stops a third of a square short of the meeting point, so neither covers the other
    const still = d.type === "T" || d.type === "F", aPos = still ? 1 - 2 * gap : meet - gap, dPos = still ? 1 : meet + gap, hit = (aPos + dPos) / 2;
    trace("fight start");
    const ms = reduce ? 1 : Math.min(300, 190 + (L - 1) * 30);
    await Promise.all([slide(ca, c, aPos, ms, "cubic-bezier(.5,0,.9,.6)"), slide(cd, c, dPos, ms, "cubic-bezier(.5,0,.9,.6)"), lift(ca, 14, ms, .9), lift(cd, 14, ms, .9)]);
    trace("clash");
    sfx.hit(); if (tier === 2) sfx.big();
    sparks(c, hit); if (tier >= 1) shakeBoard(tier === 2);
    if (tier === 2 && !reduce){ const fl = document.createElement("div"); fl.className = "flash"; document.body.appendChild(fl); setTimeout(() => fl.remove(), 700); }
    // the hidden one turns over as they meet; then both stay face up for a moment
    const flips = [];
    if (masked(a)) flips.push(flip3d(ca, faceHtml(a)));
    if (masked(d)) flips.push(flip3d(cd, faceHtml(d)));
    await Promise.all([...flips, wait(reduce ? 0 : [200, 240, 300][tier])]);
    trace("resolve");
    const r = ev.result;
    const aWins = r === "win" || r === "flag" || r === "defuse";
    const take = (el, f) => Promise.all([slide(el, c, f, 200, "ease-in-out"), land(el)]);
    if (aWins) await Promise.all([r === "defuse" ? sink(cd) : knockOff(cd, c, dPos, 1), take(ca, 1)]);
    else if (r === "lose") await Promise.all([knockOff(ca, c, aPos, -1), take(cd, 1)]);
    else if (r === "tie") await Promise.all([knockOff(ca, c, aPos, -1), knockOff(cd, c, dPos, 1)]);
    else if (r === "trapped"){ // the trap is used up, the attacker lands on its square and switches sides right there
      sink(cd); await slide(ca, c, 1, 200, "ease-in-out");
      // a fresh stand-in on the trap's square for the turn: iPhone Safari painted the moved one back on the square it
      // came from as soon as its block started turning, so the piece seemed to switch sides where it started
      const turned = cloneAt({ ...a, side: d.side, revealed: true }, rd, true); turned.style.fontSize = font; blk(turned).style.transform = "translateZ(14px) scale(.9)"; ca.remove(); ca = turned; // the fight showed what it really is
      sparks(c, 1, d.side === "H" ? "#5CC8FF" : "#F5A524");
      await A(blk(ca), [{ transform: "translateZ(14px) scale(.9) rotateY(0)" }, { transform: "translateZ(8px) scale(.95) rotateY(360deg)" }, { transform: "none" }], 300);
    }
    else if (r === "convert"){ cd.classList.toggle("h"); cd.classList.toggle("ai"); await Promise.all([take(ca, 0), take(cd, 1)]); }
    else await Promise.all([take(ca, 1), sink(cd)]);
    trace("fight end");
    const you = a.side === me;
    const good = r === "tie" ? null : r === "trapped" ? !you : aWins === you;
    if (good === true) sfx.win(); else if (good === false) sfx.lose();
    ca.remove(); cd.remove();
    return new Set([String(a.id), String(d.id)]);
  }
  async function afterMove(before){
    info = null;
    const events = state.events;
    if (state.winner) phase = "over";
    const fight = events.find(e => e.kind === "fight");
    let skip = null;
    if (fight) lastFight = fight;
    if (fight && !FAST){ busy = true; skip = await animateFight(before, fight); busy = false; } // free before the render, so it can offer ⚡
    else if (!FAST && state.last && !events.some(e => e.kind === "copy")) sfx.move();
    render({ skip });
    if (FAST) return;
    if (fight){ floatWinner(fight); trace("board free, AI may move"); }
    for (const e of events){
      if (e.kind === "reveal") sfx.reveal();
      if (e.kind === "rsi"){ toast("🧠 the self-improver grew"); sfx.level(); }
      if (e.kind === "agi"){ toast("THE AI HAS REACHED AGI", true); sfx.big(); }
      if (e.kind === "asi"){ toast("SUPERINTELLIGENCE · cut the power at ⚡", true); sfx.big(); }
      if (e.kind === "cut"){ toast(`⚡ POWER CUT · the 🧠 drops to ${BAL.CUT_TO}`, true, "cut"); sfx.big(); shakeBoard(true); }
    }
    if (state.winner){
      const win = state.winner === me;
      if (state.winner === "D") sfx.level();
      else { document.body.classList.add(win ? "won" : "lost"); setTimeout(() => document.body.classList.remove("won", "lost"), 1200); win ? sfx.gameWin() : sfx.gameLose(); }
    }
  }
  function toast(text, big, extra){
    const box = document.getElementById("toasts"); if (!box) return;
    const el = document.createElement("div"); el.className = "toast" + (big ? " big" : "") + (extra ? " " + extra : ""); el.textContent = text;
    if (params.has("hold")) el.style.setProperty("--hold", "999s");
    box.appendChild(el); setTimeout(() => el.remove(), params.has("hold") ? 1e9 : big ? 3800 : 2200);
  }
  // the line above the board: "Your 🕵️7 beat their 💬3"
  function fightLine(ev){
    const who = (x, first) => `<span class="${x.side === me ? "you" : "them"}">${x.side === me ? (first ? "Your" : "your") : (first ? "Their" : "their")} ${iconOf(x)}${LEVELS_UP(x.type) ? x.str : ""}</span>`;
    const A = who(ev.a, true), D = who(ev.d, false);
    return ev.result === "tie" ? `${A} and ${D} both fell` : ev.result === "lose" ? `${A} lost to ${D}` : ev.result === "trapped" ? `${A} fell into ${D} and switched sides`
      : ev.result === "defuse" ? `${A} removed ${D}` : ev.result === "convert" ? `${A} turned ${D}` : ev.result === "flag" ? `${A} took ${D}` : `${A} beat ${D}`;
  }
  // the winner's number rises from the fight square and fades (a tie: both numbers with ✕; a trap: the trap)
  function floatWinner(ev){
    const sq = app.querySelector(`.sq[data-r="${ev.r}"][data-c="${ev.c}"]`); if (!sq) return;
    const m = mid(sq), r = ev.result, el = document.createElement("div");
    const num = x => LEVELS_UP(x.type) ? x.str : iconOf(x);
    if (r === "tie"){ el.className = "float n"; el.innerHTML = `<span class="${cls(ev.a.side) === "h" ? "b" : "a"}">${num(ev.a)}</span><span class="x">✕</span><span class="${cls(ev.d.side) === "h" ? "b" : "a"}">${num(ev.d)}</span>`; }
    else if (r === "trapped"){ el.className = "float " + cls(ev.d.side); el.textContent = iconOf(ev.d); }
    else { const w = r === "lose" ? ev.d : ev.a; el.className = "float " + cls(w.side); el.textContent = num(w); }
    el.style.top = m.y + "px"; document.body.appendChild(el);
    const half = el.offsetWidth / 2 + 6; el.style.left = Math.min(Math.max(m.x, half), innerWidth - half) + "px"; // an edge square: keep it on screen
    if (params.has("hold")){ el.style.transform = "translate(-50%,-140%)"; return; } // screenshots: keep it risen and visible
    const ms = reduce ? 900 : 1200;
    el.animate(reduce ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: "translate(-50%,-30%) scale(.7)", opacity: 0 }, { transform: "translate(-50%,-70%) scale(1.1)", opacity: 1, offset: .15 }, { transform: "translate(-50%,-160%) scale(1)", opacity: 1, offset: .6 }, { transform: "translate(-50%,-220%) scale(1)", opacity: 0 }], { duration: ms, easing: "ease-out", fill: "forwards" });
    setTimeout(() => el.remove(), ms + 50);
  }
  // the full log, newest first (two-player links don't carry it, so it starts when the link is opened)
  function showLog(){
    const ov = document.createElement("div"); ov.className = "overlay"; ov.id = "logov";
    // a move by the other side names its piece only if that piece is face up (history is written from the humans' side)
    const text = h => h.mv && h.side !== me && !h.mv.open ? `${SIDE_WORD[h.side]} piece ${h.mv.from} → ${h.mv.to}` : h.text;
    const rows = state.history.slice().reverse().map(h => `<div class="${h.mile ? "mile" : ""}"><i>R${h.round}</i>${color(text(h))}</div>`).join("") || "<div>Nothing yet.</div>";
    ov.innerHTML = `<div class="card"><div class="eyebrow">Log · the last 40 · newest first</div><div class="lgs">${rows}</div><button class="primary" id="logclose">CLOSE</button></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener("click", e => { if (e.target === ov || e.target.id === "logclose") close(); });
  }
  function botTurn(){
    if (mode !== "solo" || state.turn === me || state.winner) return;
    const m = botMove(state, other(me), bot);
    if (!m) return afterMove(state);
    const before = state; state = apply(state, m);
    afterMove(before);
  }
  if (params.has("over")){ start(); phase = "play"; while (!state.winner){ const m = botMove(state, state.turn, bot); if (!m) break; state = apply(state, m); } phase = "over"; render(); }
  else if (params.has("battle") || params.has("until")){
    const want = params.get("until") || "fight";
    start("solo", params.get("side") === "AI" ? "AI" : "H"); phase = "play"; let n = 0, before = state; // &side=AI views it as the AI
    while (!state.winner && n++ < 400){ const m = botMove(state, state.turn, bot); if (!m) break; before = state; state = apply(state, m); if (state.events.some(e => e.kind === want || e.result === want)) break; } // &until=trapped: a result works too
    const after = state; state = before; render(); state = after; afterMove(before);
  }
  else if (params.has("play")) start("solo", params.get("side") === "AI" ? "AI" : "H");
  else if (params.has("g") || /[#&]g=/.test(location.hash)) loadLink(params.get("g") || location.hash);
  else render();
}
</script>
